name: Archive, Audit, & Docs Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

# One refresh at a time, shared with refresh-working-paper.yml: both commit
# the paper's generated figures and the manifests. A queued run waits rather
# than racing the one in progress, and checks out main as it is when it
# starts, not the commit that triggered it.
concurrency:
  group: paper-figures-refresh
  cancel-in-progress: false

jobs:
  audit-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # paper:build counts commits and refuses a shallow clone, which would
          # publish the fetch depth as the project's history.
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate, verify, commit and push
        id: commit_docs
        run: |
          set -euo pipefail
          git config --global user.email "copilot-agent@github.com"
          git config --global user.name "Copilot Agent"

          # Everything this job commits is generated from the tree it runs on,
          # so it is regenerated -- never rebased -- whenever main moves under
          # it. A rebase would publish figures measured before the newer merge
          # (commit count, hash, test count) and then conflict with the next
          # run on the same generated files.
          regenerate() {
            # Audit/archive/docs automation.
            node scripts/sync-docs.mjs

            # ci-checks asserts an exact inventory line in README.md and
            # AGENTS.md, but the ~15 data commits landing on main each day
            # change the file counts and none of the data workflows
            # regenerated it. The line therefore went stale constantly and
            # failed every open PR on a line it never touched. Regenerate,
            # never hand-edit.
            node scripts/compute-inventory.mjs --write

            # The working paper's figures about the repository itself (commit
            # count and hash, line counts, the size of the test suite) are
            # `volatile`: not gated per-PR, because they move on nearly every
            # PR and gating them made any two open PRs conflict on
            # data/paper/figures.json, methods.html and working-paper.html.
            # They are refreshed here, after every merge, and weekly by
            # refresh-working-paper.yml.
            #
            # After compute-inventory: the paper quotes the AGENTS.md line.
            # Manifests last, in order: rebuild_manifest.py records byte
            # counts. A refresh that does not verify is abandoned, not
            # committed.
            if npm run -s paper:build \
               && npm run -s audit:file-manifest \
               && python3 scripts/rebuild_manifest.py \
               && node scripts/validate-schemas.js \
               && npm run -s test:paper-fresh \
               && npm run -s test:file-manifest; then
              :
            else
              echo "::warning::Working-paper refresh did not verify; leaving the committed figures unchanged."
              git checkout -- working-paper.html methods.html data/paper data/_manifest.json data/manifest.json
            fi
          }

          for attempt in 1 2 3; do
            regenerate
            git add .
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Nothing to commit"
              exit 0
            fi
            git commit -m "Automated quarantine, audit, and documentation after merge"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # main moved (a data cron, or a merge whose own run is queued
            # behind this one). Start again from it rather than rebasing.
            echo "main moved during the run; regenerating on the new main (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
          done
          echo "Failed to push automation commit after 3 attempts"
          exit 1

      - name: Track quarantine candidates in an issue (human decides)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # sync-docs.mjs no longer moves unreferenced files (its old
          # "archive to _audit/" was silent deletion — _audit/ is gitignored,
          # so the copy died with the runner; it destroyed the places.json
          # generator right after PR #1040). Instead it writes a report; this
          # step keeps exactly one open tracking issue in sync with it.
          report="data/audit/quarantine-candidates.json"
          title="Quarantine candidates: unreferenced js/css/scripts files"
          count=$(jq -r '.count // 0' "$report" 2>/dev/null || echo 0)
          existing=$(gh issue list --state open --search "in:title \"$title\"" \
                       --json number --jq '.[0].number // empty')
          if [ "$count" -gt 0 ]; then
            body=$(mktemp)
            {
              printf 'Automated report from `scripts/sync-docs.mjs` (post-merge audit).\n\n'
              printf 'These files are referenced by name in no HTML/JS/MJS/CSS/MD/YML/PY file or package.json script. **Nothing is deleted automatically** — for each one, either delete it deliberately or add a reference (workflow, doc, npm script) if it is actually used. The list refreshes after every merge.\n\n'
              jq -r '.candidates[] | "- [ ] `" + . + "`"' "$report"
              printf '\nSource of truth: [`%s`](%s)\n' "$report" "https://github.com/$GITHUB_REPOSITORY/blob/main/$report"
            } > "$body"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file "$body"
              echo "Updated issue #$existing ($count candidates)."
            else
              gh issue create --title "$title" --body-file "$body"
              echo "Opened tracking issue ($count candidates)."
            fi
            rm -f "$body"
          elif [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "All previously-listed files are now referenced or deliberately removed — report is empty. Closing automatically."
            echo "Closed issue #$existing (no candidates remain)."
          else
            echo "No quarantine candidates and no open issue — nothing to do."
          fi

      - name: Dispatch Pages deploy for automation commit
        if: steps.commit_docs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Commits pushed by the workflow token do not reliably trigger
          # push-based workflows. Explicitly dispatch Pages so the public
          # artifact is rebuilt for the automation commit that just became
          # main's HEAD.
          gh workflow run deploy.yml --ref main
