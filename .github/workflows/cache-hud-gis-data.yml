name: Cache HUD GIS Overlay Data

# Fetches and caches statewide Colorado QCT, DDA, and LIHTC GeoJSON files from
# HUD ArcGIS FeatureServer so the map overlays always have a local copy to fall
# back to when the live API is slow or unreachable.
#
# Three-tier fallback on the client side:
#   (a) data/qct-colorado.json / data/dda-colorado.json  ← written by this workflow
#   (b) Live HUD ArcGIS API
#   (c) Embedded JS fallback data
#
# Run manually via the GitHub Actions UI ("Run workflow") if the cached files are
# missing or stale (e.g. after the Clifton CDP or another place is added to the
# featured geography list and its QCT tracts need to be pre-cached).

on:
  schedule:
    # Monthly on the 1st at 04:11 UTC. HUD QCT/DDA/LIHTC overlays
    # publish QUARTERLY (HUD updates after each LIHTC application round),
    # so weekly polling was downloading ~50 MB of unchanged data 51 times
    # per year. Monthly is the right cadence: catches each quarterly drop
    # within ~30 days. Saves ~2.5 GB/year egress.
    # See docs/cron-cadence-audit.md.
    - cron: '11 4 1 * *'   # 1st of each month, 04:11 UTC
  workflow_dispatch:        # Allow manual triggering from the Actions tab

permissions:
  actions: write   # dispatch deploy.yml after the data push
  contents: write
  issues: write

concurrency:
  group: data-commits
  cancel-in-progress: false
  # Hold every waiting run. Without this GitHub keeps one pending run per
  # group and silently cancels the others (10 dropped data runs, Aug-Oct 2026).
  queue: max

jobs:
  cache-hud-gis:
    runs-on: ubuntu-latest
    # The HUD fetches plus rebuild:derived (~6 minutes measured, #2063).
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # rebuild:derived runs paper:build, which refuses a shallow clone.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Environment diagnostics
        run: |
          echo "── Node.js version ──"
          node --version
          echo "── Python version ──"
          python3 --version
          echo "── Disk space ──"
          df -h .
          echo "── Run context ──"
          echo "  Repository : $GITHUB_REPOSITORY"
          echo "  Run ID     : $GITHUB_RUN_ID"

      - name: Install dependencies
        run: npm ci

      - name: Fetch HUD QCT data (Colorado)
        run: |
          node - <<'EOF'
          const fs    = require('fs');
          const { resolveDesignationYear, cachedDesignationYear, featureKey } = require(require('path').resolve('scripts/hud/designation-year.js'));
          const cachedDoc = (() => { try { return JSON.parse(fs.readFileSync('data/qct-colorado.json', 'utf8')); } catch (_) { return null; } })();

          // HUD publishes a new layer for each designation year. The coming
          // year's lists are posted each autumn (the 2027 lists on 2026-10-06,
          // 91 FR 63573) but apply only to allocations, bond issuance and
          // placement in service after Dec 31, so the layer in effect is this
          // year's until Jan 1; the January run of this monthly cron picks up
          // the new year. Try this year's layer, then last year's: a hard-coded
          // year kept serving an expired designation set without any error.
          const THIS_YEAR = new Date().getUTCFullYear();
          const YEARS = [THIS_YEAR, THIS_YEAR - 1];
          const urlFor = (y) => `https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/Qualified_Census_Tracts_${y}/FeatureServer/0/query`;
          let QCT_URL = urlFor(YEARS[0]);
          const PAGE    = 1000;
          // Try state-filter fields in order of likelihood; fall back to bounding-box filter.
          const WHERE_CANDIDATES = [
            "GEOID LIKE '08%'",
            "STATE='CO'",
            "STATE_ABBR='CO'",
            "STUSAB='CO'",
            "STATEFP='08'",
            "STATE='08'",
          ];

          async function fetchAll(where) {
            const all = { type: 'FeatureCollection', features: [] };
            let offset = 0;
            while (true) {
              const p = new URLSearchParams({
                where, outFields: '*',
                returnGeometry: 'true', f: 'geojson',
                outSR: '4326', resultRecordCount: String(PAGE), resultOffset: String(offset),
              });
              const res = await fetch(`${QCT_URL}?${p}`);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const gj = await res.json();
              if (gj.error) throw new Error(JSON.stringify(gj.error));
              const feats = gj.features || [];
              all.features.push(...feats);
              if (feats.length < PAGE) break;
              offset += PAGE;
              if (offset > 50000) break; // safety guard
            }
            return all;
          }

          async function run() {
            for (const year of YEARS) {
            QCT_URL = urlFor(year);
            for (const where of WHERE_CANDIDATES) {
              try {
                const gj = await fetchAll(where);
                if (gj.features.length) {
                  // The layer name is not the year: HUD loaded the 2027 lists into
                  // the layers named 2026 (scripts/hud/designation-year.js).
                  const r = resolveDesignationYear({
                    layerYear: year, thisYear: THIS_YEAR,
                    cachedYear: cachedDesignationYear(cachedDoc), cachedKeys: cachedDoc && (cachedDoc.features || []).map(featureKey),
                    fetchedKeys: gj.features.map(featureKey),
                  });
                  console.log(`QCT layer ${year}: ${r.reason}`);
                  if (!r.write) return;
                  const out = { ...gj, fetchedAt: new Date().toISOString(), designationYear: r.year, source: `HUD ArcGIS Qualified_Census_Tracts_${year} FeatureServer — services.arcgis.com` };
                  fs.writeFileSync('data/qct-colorado.json', JSON.stringify(out));
                  console.log(`Wrote ${out.features.length} QCT features (${r.year} designations) to data/qct-colorado.json (where: ${where})`);
                  return;
                }
                console.warn(`QCT where="${where}" returned 0 features, trying next filter`);
              } catch(err) {
                console.warn(`QCT ${year} where="${where}" failed: ${err.message}`);
              }
            }
            }
            throw new Error('All QCT WHERE filters exhausted with no results');
          }

          run().catch(err => {
            console.error('QCT fetch failed:', err.message);
            // Fall back to the existing cached file rather than failing the workflow.
            const cached = 'data/qct-colorado.json';
            if (fs.existsSync(cached)) {
              try {
                const saved = JSON.parse(fs.readFileSync(cached, 'utf8'));
                if (saved.features && saved.features.length) {
                  console.warn(`[fallback] API unavailable — keeping existing ${cached} (${saved.features.length} features)`);
                  process.exit(0);
                }
              } catch(_) {}
            }
            process.exit(1);
          });
          EOF

      - name: Fetch HUD DDA data (Colorado only — pre-filtered to FIPS 08)
        run: |
          node - <<'EOF'
          const fs    = require('fs');
          const { resolveDesignationYear, cachedDesignationYear, featureKey } = require(require('path').resolve('scripts/hud/designation-year.js'));
          const cachedDoc = (() => { try { return JSON.parse(fs.readFileSync('data/dda-colorado.json', 'utf8')); } catch (_) { return null; } })();

          // HUD publishes a new layer for each designation year. The coming
          // year's lists are posted each autumn (the 2027 lists on 2026-10-06,
          // 91 FR 63573) but apply only to allocations, bond issuance and
          // placement in service after Dec 31, so the layer in effect is this
          // year's until Jan 1; the January run of this monthly cron picks up
          // the new year. Try this year's layer, then last year's: a hard-coded
          // year kept serving an expired designation set without any error.
          const THIS_YEAR = new Date().getUTCFullYear();
          const YEARS = [THIS_YEAR, THIS_YEAR - 1];
          const urlFor = (y) => `https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/Difficult_Development_Areas_${y}/FeatureServer/0/query`;
          let DDA_URL = urlFor(YEARS[0]);
          const PAGE    = 1000;
          // Colorado has two kinds of DDA: nonmetro counties (DDA_TYPE 'NM',
          // DDA_CODE NCNTY08xxx…) and metro Small Area DDAs (DDA_TYPE 'SA'),
          // which HUD designates by ZIP (ZCTA5). Colorado ZIPs are 80xxx and
          // 81xxx. Keeping only the NCNTY rows dropped every metro ZIP DDA
          // (Denver 80202, Colorado Springs 80920-80930, …).
          // Try a server-side Colorado filter first; fall back to fetching all and filtering client-side.
          const WHERE_CANDIDATES = [
            "DDA_CODE LIKE 'NCNTY08%' OR (DDA_TYPE = 'SA' AND (ZCTA5 LIKE '80%' OR ZCTA5 LIKE '81%'))",
            '1=1',  // full dataset — will be filtered client-side below
          ];

          function isColorado(feature) {
            const p = feature.properties || {};
            const code = p.DDA_CODE || '';
            if (code.startsWith('NCNTY08')) return true;
            return p.DDA_TYPE === 'SA' && /^8[01]\d{3}$/.test(String(p.ZCTA5 || ''));
          }

          async function fetchAll(where) {
            const all = { type: 'FeatureCollection', features: [] };
            let offset = 0;
            while (true) {
              const p = new URLSearchParams({
                where, outFields: '*',
                returnGeometry: 'true', f: 'geojson',
                outSR: '4326', resultRecordCount: String(PAGE), resultOffset: String(offset),
              });
              const res = await fetch(`${DDA_URL}?${p}`);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const gj = await res.json();
              if (gj.error) throw new Error(JSON.stringify(gj.error));
              const feats = gj.features || [];
              all.features.push(...feats);
              if (feats.length < PAGE) break;
              offset += PAGE;
              if (offset > 10000) break; // safety guard
            }
            return all;
          }

          async function run() {
            for (const year of YEARS) {
            DDA_URL = urlFor(year);
            for (const where of WHERE_CANDIDATES) {
              try {
                const gj = await fetchAll(where);
                // Always apply client-side filter to guarantee only Colorado features are written.
                const coFeats = gj.features.filter(isColorado);
                if (coFeats.length) {
                  // The layer name is not the year: HUD loaded the 2027 lists into
                  // the layers named 2026 (scripts/hud/designation-year.js).
                  const r = resolveDesignationYear({
                    layerYear: year, thisYear: THIS_YEAR,
                    cachedYear: cachedDesignationYear(cachedDoc), cachedKeys: cachedDoc && (cachedDoc.features || []).map(featureKey),
                    fetchedKeys: coFeats.map(featureKey),
                  });
                  console.log(`DDA layer ${year}: ${r.reason}`);
                  if (!r.write) return;
                  const out = { ...gj, features: coFeats, fetchedAt: new Date().toISOString(), designationYear: r.year, source: `HUD ArcGIS Difficult_Development_Areas_${year} FeatureServer — services.arcgis.com` };
                  fs.writeFileSync('data/dda-colorado.json', JSON.stringify(out));
                  const nCounty = coFeats.filter((f) => String((f.properties || {}).DDA_CODE || '').startsWith('NCNTY08')).length;
                  console.log(`Wrote ${coFeats.length} Colorado DDA features (${nCounty} nonmetro counties, ${coFeats.length - nCounty} Small Area ZIP rows) to data/dda-colorado.json (where: ${where}, total fetched: ${gj.features.length})`);
                  return;
                }
                console.warn(`DDA where="${where}" returned 0 Colorado features, trying next filter`);
              } catch(err) {
                console.warn(`DDA ${year} where="${where}" failed: ${err.message}`);
              }
            }
            }
            throw new Error('All DDA WHERE filters exhausted with no Colorado results');
          }

          run().catch(err => {
            console.error('DDA fetch failed:', err.message);
            // Fall back to the existing cached file rather than failing the workflow.
            const cached = 'data/dda-colorado.json';
            if (fs.existsSync(cached)) {
              try {
                const saved = JSON.parse(fs.readFileSync(cached, 'utf8'));
                if (saved.features && saved.features.length) {
                  console.warn(`[fallback] API unavailable — keeping existing ${cached} (${saved.features.length} features)`);
                  process.exit(0);
                }
              } catch(_) {}
            }
            process.exit(1);
          });
          EOF

      - name: Normalize DDA data (map HUD field names to front-end schema)
        run: node scripts/normalize-dda.js

      - name: Build Colorado county boundaries
        run: python scripts/boundaries/build_counties_co.py

      - name: Validate output files
        id: validate
        run: |
          echo "── Validating output files ──"
          for f in data/qct-colorado.json data/dda-colorado.json; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing output file: $f"
              exit 1
            fi
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "  $f: ${size} bytes"
            count=$(jq '.features | length' "$f" 2>/dev/null || echo "invalid")
            echo "  Features: ${count}"
            if [ "$count" = "invalid" ]; then
              echo "::error::$f is not valid GeoJSON"
              exit 1
            fi
            if [ "$count" -eq 0 ]; then
              echo "::warning::$f has 0 features — HUD API may have returned empty results"
            fi
          done
          echo "  Validation passed ✅"

      # The scripts/monitoring/alert.js step was removed when this workflow moved to
      # the external monitor (.github/workflows/workflow-outcome-monitor.yml).
      #
      # It never produced anything. alert.js opens an issue only when GITHUB_TOKEN is
      # in the environment, and actions/github-script exposes a token on its client
      # object rather than exporting one -- so `{ ...process.env }` inherited an
      # environment that never had it. Zero issues in this repository's history match
      # alert.js's title formats, across fifteen callers.
      - name: Rebuild the derived chain and commit it with the overlays
        # qct-colorado.json and dda-colorado.json are ranking-index inputs.
        # Committing them alone left the index, scenarios and digests
        # describing the previous overlays, with no failing run (#2092). The
        # script rebuilds the chain, validates, commits inputs and derived files
        # together, runs the freshness checkers and pushes, or commits nothing.
        # A new designation year also rewrites the QCT/DDA labels and fallback
        # endpoints that name it (scripts/sync-hud-vintage-labels.mjs); they
        # are committed with the overlays they describe.
        run: |
          node scripts/sync-hud-vintage-labels.mjs
          LABEL_FILES=$(node --input-type=module -e "import('./scripts/sync-hud-vintage-labels.mjs').then(m => console.log([...new Set(m.RULES.flatMap(r => r.files))].join(' ')))")
          scripts/commit-with-derived-chain.sh "chore: update HUD QCT/DDA overlay cache and county boundaries [$(date -u '+%Y-%m-%d')]" -- data/qct-colorado.json data/dda-colorado.json data/co-county-boundaries.json data/boundaries/counties_co.geojson $LABEL_FILES

      - name: Dispatch Pages deploy for this run's commit
        # A workflow-token push does not trigger deploy.yml (#1875).
        uses: ./.github/actions/dispatch-pages-deploy
