name: Fetch FRED Data

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Environment diagnostics
        run: |
          echo "── Python version ──"
          python3 --version
          echo "── Node.js version ──"
          node --version
          echo "── Disk space ──"
          df -h .
          echo "── Run context ──"
          echo "  Repository : $GITHUB_REPOSITORY"
          echo "  Run ID     : $GITHUB_RUN_ID"
          echo "── API key check ──"
          python3 -c "
          import os, sys
          k = os.environ.get('FRED_API_KEY', '').strip()
          if k:
              print(f'  FRED_API_KEY: set ({len(k)} chars)')
          else:
              print('  FRED_API_KEY: NOT SET ⚠️', file=sys.stderr)
          "
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Build data/fred-data.json from FRED API
        id: fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          echo "── Starting FRED fetch at $(date -u) ──"
          python3 scripts/fetch_fred_data.py
          echo "── FRED fetch completed at $(date -u) ──"

      - name: Validate output
        id: validate
        run: |
          OUT="data/fred-data.json"
          echo "── Validating $OUT ──"
          if [ ! -f "$OUT" ]; then
            echo "::error::Output file not found: $OUT"
            exit 1
          fi
          size=$(stat -c%s "$OUT" 2>/dev/null || stat -f%z "$OUT")
          echo "  File size: ${size} bytes"
          if [ "$size" -eq 0 ]; then
            echo "::error::Output file is empty (0 bytes)"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          with open("data/fred-data.json") as f:
              d = json.load(f)
          series = d.get("series", {})
          total = len(series)
          with_data = sum(1 for v in series.values() if v.get("observations"))
          empty = total - with_data
          print(f"  Series total   : {total}")
          print(f"  With data      : {with_data}")
          print(f"  Empty series   : {empty}")
          print(f"  Updated        : {d.get('updated', 'unknown')}")
          if total == 0:
              print("::error::No series found in FRED data output", file=sys.stderr)
              sys.exit(1)
          if with_data == 0:
              print("::error::All FRED series have zero observations", file=sys.stderr)
              sys.exit(1)
          print("  Validation passed ✅")
          PY

      - name: Alert on empty dataset
        if: ${{ failure() && (steps.fetch.conclusion == 'failure' || steps.validate.conclusion == 'failure') }}
        uses: actions/github-script@v9
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const { execSync } = require('child_process');
            try {
              execSync(
                `node scripts/monitoring/alert.js --mode empty-dataset --workflow fetch-fred-data.yml --run-id ${context.runId} --data-file data/fred-data.json --details "FRED fetch produced no usable dataset (0 populated series). Check API availability and secret configuration."`,
                { stdio: 'inherit', env: { ...process.env } }
              );
            } catch (e) {
              console.error('Alert script failed:', e.message);
            }

      - name: Commit and push updated data
        id: data-commit
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/rebuild_manifest.py
          git add data/fred-data.json data/manifest.json
          if git diff --cached --quiet; then
            echo "No FRED data changes to commit."
            exit 0
          fi
          git commit -m "chore: update FRED data $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash -X theirs origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.data-commit.outputs.pushed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            core.notice('Dispatched deploy.yml for FRED data commit.');
