name: Backfill HNA Home-Value Brackets

# One-off (re-runnable) job that fills DP04_0080E - DP04_0088E into every
# cached data/hna/summary/*.json file's acsProfile object so F160's
# home-value distribution chart populates immediately on the public site.
#
# Skips files that already have DP04_0083E (cheap idempotency check), so
# re-running after the first pass only touches new summaries.
#
# Triggered manually via Actions → "Backfill HNA Home-Value Brackets"
# → Run workflow. Also fires on a quarterly cron in case new summary
# files land between manual runs.

on:
  schedule:
    - cron: '33 7 1 */3 *'   # 07:33 UTC on the 1st of Jan/Apr/Jul/Oct
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run only (no writes)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  actions: write   # dispatch deploy.yml after the data push
  contents: write
  pull-requests: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # The backfill itself is minutes; rebuild:derived measured 6m locally
    # (2026-10-06, #2063). 15 would cancel mid-chain, and a cancelled run
    # renders grey, not red.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # rebuild:derived runs paper:build, which refuses a shallow clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sanity-check secret
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          if [ -z "${CENSUS_API_KEY}" ]; then
            echo "::error::CENSUS_API_KEY not set in repo secrets — cannot run."
            exit 1
          fi
          echo "CENSUS_API_KEY set (${#CENSUS_API_KEY} chars)"

      - name: Backfill (dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          node scripts/backfill_dp04_value_brackets.mjs --dry

      - name: Backfill (real)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          node scripts/backfill_dp04_value_brackets.mjs

      - name: Show diff summary
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "── files changed ──"
          git diff --stat -- 'data/hna/summary/*.json' | tail -30 || echo "(no changes)"
          changed=$(git diff --name-only -- 'data/hna/summary/*.json' | wc -l | tr -d ' ')
          echo "changed_count=${changed}" >> "$GITHUB_OUTPUT"

      - name: Rebuild the derived chain and commit it with the summaries
        if: ${{ github.event.inputs.dry_run != 'true' }}
        # The summaries are inputs to the ranking index and the digests.
        # Committing them alone left 30 digests stale on main on 2026-10-01
        # (#2063). The script runs rebuild:derived, validates, commits the
        # summaries and every derived path together, runs the freshness
        # checkers, and pushes, or commits nothing and fails.
        run: |
          scripts/commit-summary-backfill.sh 'data(F165): backfill DP04_0080-0088E home-value brackets into HNA summary files'

      - name: Dispatch Pages deploy for this run's commit
        # A workflow-token push does not trigger deploy.yml (#1875).
        uses: ./.github/actions/dispatch-pages-deploy

      - name: Summarize
        if: always()
        run: |
          echo "## Backfill Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry-run: ${{ github.event.inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- See the run logs for per-file filled / skipped / errored counts." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git log -1 --oneline 2>/dev/null | grep 'F165')" ]; then
            echo "- Committed: $(git log -1 --oneline)" >> "$GITHUB_STEP_SUMMARY"
          fi
