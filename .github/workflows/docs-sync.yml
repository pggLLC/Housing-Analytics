name: Docs Sync — Generate Inventory

on:
  schedule:
    # Every Thursday at 06:13 UTC
    - cron: '13 6 * * 4'   # Thursdays 06:13 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write         # dispatch ci-checks.yml on the PR branch

concurrency:
  group: docs-sync-generated-inventory
  cancel-in-progress: false

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run docs sync
        run: node scripts/sync-docs.mjs

      - name: Regenerate JSDoc API reference
        run: npm run docs:api

      - name: Regenerate test-coverage report
        run: npm run docs:coverage

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/ || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and open PR
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stable branch name -- see market_data_build.yml. A per-run branch
          # left #1485 and #1494 open simultaneously for the same regeneration.
          BRANCH="docs/generated-inventory"
          # Capture the exact remote tip before replacing the generated branch.
          # The explicit lease below refuses to overwrite a concurrent update.
          REMOTE_BRANCH_SHA=$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')
          git checkout -B "$BRANCH"
          git add docs/
          git commit -m "docs: regenerate inventory and refresh deprecated-doc banners [$(date +%Y-%m-%d)]"
          if [ "${{ github.ref_name }}" = "main" ]; then
            git fetch origin main
            git rebase --autostash origin/main
          fi
          git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_BRANCH_SHA" --set-upstream origin "$BRANCH"
          PUSHED_SHA=$(git rev-parse HEAD)

          TITLE="docs: regenerate inventory and refresh deprecated-doc banners [$(date +%Y-%m-%d)]"
          BODY="Automated weekly docs sync. Updates \`docs/GENERATED-INVENTORY.md\` with current HTML pages, data files, test files, workflows, and .gitignore status. Also refreshes the auto-sync banners in all superseded/deprecated docs so their notices always reflect live repo stats."
          EXISTING_PR=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$BODY"
          else
            gh pr create \
              --title "$TITLE" \
              --body "$BODY" \
              --base main \
              --head "$BRANCH"
          fi

          # Run ci-checks on the pushed head so the PR carries a real result.
          # A PR or push made with GITHUB_TOKEN starts no push workflow, and
          # its pull_request run is held at "action_required" until someone
          # approves it -- on the PR that reads as "only CodeQL ran". A
          # workflow_dispatch is the exception GitHub makes for GITHUB_TOKEN,
          # and the dispatched run reports its check on the branch head, which
          # is the PR head. dispatch.sh waits until the branch reports the SHA
          # just pushed, so it never verifies the previous tip, and fails this
          # step if the API does not catch up. Needs `actions: write` (above).
          # It runs after the PR step so a slow API cannot stop the PR from
          # opening or updating; the step still fails if the wait times out.
          bash .github/actions/dispatch-ci-checks/dispatch.sh "$BRANCH" "$PUSHED_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
