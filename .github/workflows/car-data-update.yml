name: CAR Data Update

on:
  schedule:
    - cron: '47 4 1 * *'   # 1st of each month, 04:47 UTC
  workflow_dispatch:        # Allow manual triggering from the Actions tab

permissions:
  actions: write   # dispatch deploy.yml after the data push
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false
  # Hold every waiting run. Without this GitHub keeps one pending run per
  # group and silently cancels the others (10 dropped data runs, Aug-Oct 2026).
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The derived chain's paper:build step measures repo history.
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Fetch CAR ShowingTime county data (best effort)
        run: node scripts/fetch-car-showingtime.mjs

      - name: Generate CAR placeholder data for current month
        run: node scripts/generate-car-placeholder.mjs

      - name: Index the CAR reports that exist
        # The pages read this list instead of guessing this month's filename,
        # which 404'd on the 1st until this workflow landed (#2053).
        run: node scripts/build-car-report-index.mjs

      # The scripts/monitoring/alert.js step was removed when this workflow moved to
      # the external monitor (.github/workflows/workflow-outcome-monitor.yml).
      #
      # It never produced anything. alert.js opens an issue only when GITHUB_TOKEN is
      # in the environment, and actions/github-script exposes a token on its client
      # object rather than exporting one -- so `{ ...process.env }` inherited an
      # environment that never had it. Zero issues in this repository's history match
      # alert.js's title formats, across fifteen callers.
      - name: Download Zillow city ZHVI
        # build:home-values rebuilds place rows only when this CSV is on disk
        # (it is gitignored). No workflow downloaded it, so from May 2026 every
        # rebuild kept the committed place rows and their ZHVI month froze at
        # 2026-05 while Zillow published June, July and August. A failed
        # download leaves the committed rows in place, as before.
        #
        # The builder treats the file's existence as authoritative, so a
        # truncated transfer must never reach that path: download to a temp
        # file, check it is a whole ZHVI table with Colorado rows, then move it.
        run: |
          mkdir -p data/zillow
          dest=data/zillow/city_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month.csv
          tmp="$(mktemp)"
          if curl -fsSL --retry 3 --max-time 300 -o "$tmp" \
               "https://files.zillowstatic.com/research/public_csvs/zhvi/City_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month.csv" \
             && head -1 "$tmp" | grep -q '^RegionID,SizeRank,RegionName,RegionType,StateName,State,' \
             && [ "$(wc -l < "$tmp")" -ge 15000 ] \
             && [ "$(grep -c ',CO,' "$tmp")" -ge 200 ]; then
            mv "$tmp" "$dest"
          else
            rm -f "$tmp" "$dest"
            echo "::warning::Zillow city ZHVI download failed or was incomplete; place rows keep their committed month."
          fi

      - name: Rebuild the home-value cascade
        # Its CAR review flags are computed from the latest county report. On
        # 2026-10-11 this workflow added county prices to the 2026-09 report and
        # committed it alone; the cascade kept a flag from the 2026-08 report and
        # main failed test/home-value-integrity.test.mjs until it was rebuilt.
        # build:home-values writes the new values into data/hna/summary but not
        # the income-to-own suppression rule, and it reformats every summary.
        # The stamp applies the rule and restores the compact format the HNA
        # build writes; without it test:hna-home-values fails on the commit.
        run: |
          npm run build:home-values
          node scripts/hna/stamp_home_value_cascade.mjs

      - name: Re-check the Redfin tracker's review flags
        # The place tracker flags modeled prices above the latest CAR county
        # median too. This re-checks the committed tracker offline; a full
        # rebuild would re-download Redfin. Left stale on 2026-10-11, it failed
        # tests/test_market_construction.py on main.
        run: python3 scripts/market/build_redfin_place_market_tracker.py --refresh-review-flags

      - name: Rebuild derived data and commit the refresh
        id: commit
        # The cascade feeds the jurisdiction digests, so the commit goes through
        # the derived chain (AGENTS.md: a workflow that commits a chain input
        # must run the chain before it commits).
        env:
          DERIVED_COMMIT_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit-with-derived-chain.sh "chore: update CAR market report data [$(date -u '+%Y-%m')]" -- \
            data/car-market-report-*.json \
            data/car-market-reports.json \
            data/hna/home-value-cascade.json \
            data/hna/zhvi-place-crosswalk.json \
            data/hna/summary \
            data/market/redfin_place_market_tracker_co.json

      - name: Dispatch Pages deploy for this run's commit
        if: steps.commit.outputs.pushed == 'true'
        # A workflow-token push does not trigger deploy.yml (#1875).
        uses: ./.github/actions/dispatch-pages-deploy
