name: CAR Data Update

on:
  schedule:
    - cron: '47 4 1 * *'   # 1st of each month, 04:47 UTC
  workflow_dispatch:        # Allow manual triggering from the Actions tab

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Fetch CAR ShowingTime county data (best effort)
        run: node scripts/fetch-car-showingtime.mjs

      - name: Generate CAR placeholder data for current month
        run: node scripts/generate-car-placeholder.mjs

      # The scripts/monitoring/alert.js step was removed when this workflow moved to
      # the external monitor (.github/workflows/workflow-outcome-monitor.yml).
      #
      # It never produced anything. alert.js opens an issue only when GITHUB_TOKEN is
      # in the environment, and actions/github-script exposes a token on its client
      # object rather than exporting one -- so `{ ...process.env }` inherited an
      # environment that never had it. Zero issues in this repository's history match
      # alert.js's title formats, across fifteen callers.
      - name: Commit and push data file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/rebuild_manifest.py
          git add data/car-market-report-*.json data/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit — CAR data is already up to date."
          else
            git commit -m "chore: update CAR market report data [$(date -u '+%Y-%m')]"
            git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME"
            python3 scripts/rebuild_manifest.py
            if ! git diff --quiet -- data/; then
              git add data/
              git commit --amend --no-edit
            fi
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
