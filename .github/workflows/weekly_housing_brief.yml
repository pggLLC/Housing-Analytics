name: Daily Housing News Update

# F161 — Renamed from "Weekly Housing Intelligence Brief" to reflect what
# this cron actually does now. The internal "weekly brief" feature was
# retired in commit 0dbcd0d4 (Phase 1 security hardening, 2026-04-19):
# `private/weekly-brief/` was gitignored + removed from the index because
# the README admitted "It is not secured" and the directory was being
# served via GitHub Pages with no access control. The build_weekly_brief.py
# script went with it.
#
# What this workflow still does:
#   1. Populates scripts/alert_feeds.txt with the canonical RSS URL list.
#   2. Runs scripts/fetch_google_alerts.py to refresh
#      data/alerts/alerts_archive.json.
#   3. Runs scripts/generate_policy_briefs.py to refresh
#      data/policy_briefs.json — the file that powers the
#      policy-briefs.html page on the public site.
#   4. Commits the refreshed feeds + alerts + briefs back to main.
#
# Step (3) IS the public-facing brief; the retired private weekly-brief
# system was a separate internal payload that no longer ships.
#
# 2026-10-14 — daily, with events and the brief news queue. The file keeps its
# name because the outcome monitor and its fixtures know it by that name.
#   - Runs every day instead of Thursdays. configure-alerts-feeds.yml, which
#     ran the same two scripts on Saturdays, is retired: one workflow, one
#     schedule.
#   - Adds one news search per jurisdiction brief
#     (scripts/news/brief_news_feeds.py), so small brief towns surface.
#   - Fetches upcoming events (scripts/news/fetch_housing_events.py →
#     data/policy/housing-events.json) for the News page's events panel.
#   - Builds the brief news queue (scripts/news/build_brief_news_queue.py →
#     data/alerts/brief-news-queue.json) shown on each brief, and rewrites the
#     one "Jurisdiction briefs to review" issue from it.
#   - Rebuilds data/_manifest.json before data/manifest.json, the order
#     AGENTS.md requires (it rebuilt only the second).

on:
  schedule:
    # GitHub starts these ~3-5h late (AGENTS.md; 11:00-11:50 UTC for 06:29 on
    # Oct 15-18), so both land inside the 00:00-05:00 Mountain commit window
    # (06:00-11:00 UTC).
    - cron: '23 3 * * *'   # daily 03:23 UTC, lands ~06:30-08:30 UTC
    # Backup. On 2026-10-19 the 06:29 run had not started by 12:18 UTC, so
    # Housing News still showed the day before's headlines. A scheduled run
    # finds out first (gate job) whether today's refresh already landed and
    # stops if so, so the two never both fetch and summarize.
    - cron: '47 5 * * *'   # 05:47 UTC, lands ~09:00-11:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write          # the "Jurisdiction briefs to review" issue

concurrency:
  group: data-commits
  cancel-in-progress: false
  # Hold every waiting run. Without this GitHub keeps one pending run per
  # group and silently cancels the others (10 dropped data runs, Aug-Oct 2026).
  queue: max

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout the news file only
        uses: actions/checkout@v7
        with:
          sparse-checkout: data/policy_briefs.json
          sparse-checkout-cone-mode: false
      - name: Run unless a scheduled run already refreshed today
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          today=$(date -u +%F)
          generated=$(python3 -c "import json; print(json.load(open('data/policy_briefs.json'))['meta']['generated'][:10])" 2>/dev/null || echo none)
          if [ "$EVENT" = "schedule" ] && [ "$generated" = "$today" ]; then
            echo "News already refreshed today ($generated); nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last refresh: $generated; running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh-policy-briefs:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install feedparser

      - name: Populate alert_feeds.txt with production URLs
        run: |
          cat > scripts/alert_feeds.txt << 'FEEDS'
          # RSS feed URLs for housing news alerts (one per line)
          # Auto-populated by weekly_housing_brief.yml — do not edit manually
          # The per-brief searches are appended by scripts/news/brief_news_feeds.py.

          # ── Google News: Colorado affordable housing topics ──
          https://news.google.com/rss/search?q=colorado+affordable+housing&hl=en-US&gl=US&ceid=US:en
          https://news.google.com/rss/search?q=colorado+zoning+land+use+housing&hl=en-US&gl=US&ceid=US:en
          https://news.google.com/rss/search?q=colorado+housing+policy+legislature&hl=en-US&gl=US&ceid=US:en
          https://news.google.com/rss/search?q=LIHTC+tax+credit+affordable+housing&hl=en-US&gl=US&ceid=US:en
          https://news.google.com/rss/search?q=CHFA+Colorado+housing+finance&hl=en-US&gl=US&ceid=US:en

          # ── Google News: funding rounds and the infrastructure housing needs ──
          # Added 2026-10-15: none of the searches above found infrastructure
          # money (water, sewer, tap fees, DOLA grants). The agency pages
          # themselves are watched by chfa-qap-watch.yml (funding-watch job).
          https://news.google.com/rss/search?q=colorado+housing+infrastructure+grant&hl=en-US&gl=US&ceid=US:en
          https://news.google.com/rss/search?q=%22Energy+and+Mineral+Impact%22+OR+EIAF+colorado&hl=en-US&gl=US&ceid=US:en
          https://news.google.com/rss/search?q=colorado+%22tap+fees%22+housing&hl=en-US&gl=US&ceid=US:en
          https://news.google.com/rss/search?q=colorado+water+sewer+housing+grant&hl=en-US&gl=US&ceid=US:en
          https://news.google.com/rss/search?q=DOLA+grant+housing+colorado&hl=en-US&gl=US&ceid=US:en

          # ── NCSHA: National Council of State Housing Agencies ──
          https://www.ncsha.org/feed/

          # ── Google News: national housing trends, listed outlets only ──
          # Added 2026-10-20 (paul): "only very strong researched national
          # trends with very reputable sources". Each search is limited to
          # these sites; scripts/generate_policy_briefs.py keeps only
          # housing-trend headlines from them (NATIONAL_SOURCE_RE) and shows
          # them in the National trends panel, not in the Colorado news.
          https://news.google.com/rss/search?q=housing+%28site%3Awsj.com+OR+site%3Anytimes.com+OR+site%3Abloomberg.com+OR+site%3Areuters.com+OR+site%3Aapnews.com+OR+site%3Awashingtonpost.com+OR+site%3Aft.com+OR+site%3Aeconomist.com+OR+site%3Anpr.org%29&hl=en-US&gl=US&ceid=US:en
          https://news.google.com/rss/search?q=%28homebuilders+OR+%22home+builders%22+OR+construction%29+%28site%3Awsj.com+OR+site%3Anytimes.com+OR+site%3Abloomberg.com+OR+site%3Areuters.com+OR+site%3Aapnews.com+OR+site%3Awashingtonpost.com+OR+site%3Aft.com+OR+site%3Aeconomist.com+OR+site%3Anpr.org%29&hl=en-US&gl=US&ceid=US:en
          https://news.google.com/rss/search?q=%28mortgage+OR+%22home+prices%22+OR+%22home+sales%22%29+%28site%3Awsj.com+OR+site%3Anytimes.com+OR+site%3Abloomberg.com+OR+site%3Areuters.com+OR+site%3Aapnews.com+OR+site%3Awashingtonpost.com+OR+site%3Aft.com+OR+site%3Aeconomist.com+OR+site%3Anpr.org%29&hl=en-US&gl=US&ceid=US:en
          https://news.google.com/rss/search?q=housing+%28site%3Ajchs.harvard.edu+OR+site%3Aurban.org+OR+site%3Abrookings.edu+OR+site%3Aternercenter.berkeley.edu+OR+site%3Apewtrusts.org+OR+site%3Aeyeonhousing.org+OR+site%3Afreddiemac.com+OR+site%3Anlihc.org%29&hl=en-US&gl=US&ceid=US:en

          # Removed 2026-06-10 (F253): novoco.com/rss.xml,
          # hudexchange.info/feed/, leg.colorado.gov/rss.xml all return
          # 404. The Google News queries above cover the same topical
          # surface.
          FEEDS
          python3 scripts/news/brief_news_feeds.py >> scripts/alert_feeds.txt
          echo "Feeds: $(grep -c '^https' scripts/alert_feeds.txt)"

      - name: Fetch RSS alerts
        env:
          ALERT_FEEDS_FILE: scripts/alert_feeds.txt
          ALERTS_MAX_AGE_DAYS: '90'
        run: |
          echo "── Fetching alerts at $(date -u) ──"
          python3 scripts/fetch_google_alerts.py
          echo "── Alert fetch complete ──"

      - name: Debug OPENAI_API_KEY presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "✓ OPENAI_API_KEY is set — LLM-assisted mode will be attempted"
          else
            echo "⚠ OPENAI_API_KEY is NOT set — briefs will use rule-based mode"
          fi

      # The owner's picks: his Google Alerts (data/alerts/owner-feeds.txt) wait
      # in the "News picks to review" issue until ticked; links he pastes in the
      # "News link" issue form are published. Before the briefs, which add the
      # published picks to the stories. Reads issues only; the issue writes
      # happen after the push (sync step below).
      - name: Owner news picks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/news/owner_news_picks.py

      # Outlets ticked in the "Outlets to review" issue, before the stories
      # are built, so a tick takes effect in this run. Reads the issue only.
      - name: Apply outlet review ticks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/news/outlet_review.py --apply

      - name: Generate policy briefs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRIEFS_MAX: '20'
        run: |
          echo "── Generating policy briefs at $(date -u) ──"
          python3 scripts/generate_policy_briefs.py
          echo "── Brief generation complete ──"
          python3 - <<'PY'
          import json
          with open("data/policy_briefs.json") as f:
              d = json.load(f)
          meta = d.get("meta", {})
          print(f"  Brief count    : {meta.get('brief_count', 0)}")
          print(f"  Source alerts  : {meta.get('source_alerts', 0)}")
          mode = "LLM-assisted" if "LLM-assisted" in meta.get("methodology", "") else "Rule-based"
          print(f"  Mode           : {mode}")
          PY

      - name: Fetch upcoming housing events
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/news/fetch_housing_events.py

      - name: Build the brief news queue
        run: python3 scripts/news/build_brief_news_queue.py

      # paul, 2026-10-31: unverified outlets are reviewed on every news run.
      - name: List outlets to review
        run: python3 scripts/news/outlet_review.py

      # F161 — Removed the "Build weekly brief" step entirely. It was calling
      # private/weekly-brief/scripts/build_weekly_brief.py, which was deleted
      # from the index in commit 0dbcd0d4 (security hardening, see header).
      # The F157 `if [ -f … ]` guard kept the cron green but printed
      # "skipping" every Monday, giving a misleading "Weekly Housing
      # Intelligence Brief: success" signal in CI when nothing was actually
      # built. The real public-facing brief generation happens in the
      # `Generate policy briefs` step above (writes data/policy_briefs.json)
      # — that's the file the policy-briefs.html page reads from.

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # F161 — Stripped the `git add private/weekly-brief/` line.
          # private/ has been .gitignore'd since the Apr 19 security commit,
          # so the add was a no-op anyway, but leaving it implied this
          # workflow still ships a private brief. It doesn't.
          node scripts/validate-schemas.js
          git add scripts/alert_feeds.txt
          git add data/alerts/alerts_archive.json
          git add data/policy_briefs.json
          git add data/policy/housing-events.json
          git add data/alerts/brief-news-queue.json
          git add data/alerts/owner-news.json
          git add data/alerts/outlet-review.json data/alerts/outlet-decisions.json
          git add robots.txt || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "PUSHED=false" >> "$GITHUB_ENV"
          else
            git commit -m "chore: daily housing news refresh $(date -u '+%Y-%m-%d')"
            # The two manifests are not in that commit while it is rebased.
            # They record every data file's bytes, so nearly every commit to
            # main changes them (the post-merge archive job always does), and a
            # news commit carrying them conflicts on rebase: the first run after
            # #2215 failed that way. So the news-only commit is rebased (F161:
            # other workflows land on main while this job runs), the manifests
            # are rebuilt and validated on the rebased tree and amended into
            # it, and the one commit is pushed. If main moved again, the commit
            # goes back to news-only and round again.
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main
              news_only=$(git rev-parse HEAD)
              npm run -s audit:file-manifest
              python3 scripts/rebuild_manifest.py
              node scripts/validate-schemas.js
              git add data/_manifest.json data/manifest.json
              git commit --amend --no-edit
              if git push; then pushed=true; break; fi
              echo "Push rejected on attempt $attempt: main moved. Retrying."
              git reset --hard "$news_only"
              sleep $((attempt * 10))
            done
            if [ "$pushed" != true ]; then
              echo "::error::main kept moving; the news refresh was not pushed after 3 attempts." >&2
              exit 1
            fi
            echo "PUSHED=true" >> "$GITHUB_ENV"
          fi

      # Bot pushes (GITHUB_TOKEN) do not trigger downstream push-event workflows.
      # Explicitly dispatch deploy.yml so GitHub Pages stays current after each
      # data-only commit. The watchdog (pages-deploy-watchdog.yml) fails if
      # deploy.yml has no run for the latest main SHA.
      - name: Trigger Pages deploy
        if: env.PUSHED == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            core.notice('Dispatched deploy.yml for latest main commit.');

      # After the data push, so a failure here never holds back the news. Main only.
      - name: Rewrite the "Jurisdiction briefs to review" issue
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/news/update-brief-review-issue.mjs data/alerts/brief-news-queue.json

      # After the push, so a link issue is closed only once its pick is on main.
      - name: Close added news links and rewrite "News picks to review"
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/news/owner_news_picks.py --sync-issues

      # After the push. Rewrites the issue every run; once a week it adds a
      # comment with the week's sourcing, so the review is asked for weekly.
      - name: Rewrite "Outlets to review"
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/news/outlet_review.py --sync-issue
