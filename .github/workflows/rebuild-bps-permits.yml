name: Rebuild BPS Permits

# Keeps the Census Building Permits Survey pipeline fresh end-to-end:
#   scripts/hna/build_permits.py            → data/hna/permits.json
#   scripts/hna/build_place_projections.py  → data/hna/projections/places.json
#   scripts/hna/build_place_pages.py        → places/*.html
#
# Two staleness channels make this necessary:
#   1. New BPS annual vintage (~May each year); a weekly run picks it up
#      within 7 days (same spirit as rebuild-place-od-flows.yml for LODES).
#   2. build-hna-data.yml (Saturdays 07:23 UTC) commits new county DOLA
#      projections; permits.json bakes production_vs_need from those, and
#      places.json downscales them, so both drift the same day. That
#      workflow pushes with GITHUB_TOKEN — which never fires other
#      workflows' push triggers — so the re-sync runs on its own cron the
#      following day instead. The push trigger below still catches
#      HUMAN/PR commits that touch the projections or scripts.
#
# The whole chain is rebuilt and committed atomically — permits.json is a
# place-page input, so committing it without regenerating places/ would
# trip the place-pages-fresh gate (the Silt drift-bug class).
#
# NOTE: this workflow referencing build_permits.py and
# build_place_projections.py by filename is also what keeps the post-merge
# quarantine automation (scripts/sync-docs.mjs) from sweeping them as
# "unreferenced" — that already deleted build_place_projections.py once.

on:
  schedule:
    # Sundays — comfortably after build-hna-data (Saturdays 07:23 UTC)
    # finishes committing refreshed projections.
    - cron: '37 4 * * 0'   # Sundays 04:37 UTC
  push:
    branches: ['main']
    paths:
      # places.json is committed BY this workflow; GITHUB_TOKEN pushes don't
      # retrigger workflows, so no loop.
      - 'data/hna/projections/*.json'
      - 'scripts/hna/build_permits.py'
      - 'scripts/hna/build_place_projections.py'
      - '.github/workflows/rebuild-bps-permits.yml'
  workflow_dispatch:
    inputs:
      refresh_all:
        description: 'Re-download ALL cached BPS years (default: newest 2 only)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: rebuild-bps-permits
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # ~22 census.gov fetches at 3s pacing plus WAF-backoff headroom.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
        # stdlib only — no pip installs needed for any script in the chain.

      - name: Build permits dataset
        run: |
          if [ "${{ inputs.refresh_all || 'false' }}" = "true" ]; then
            python3 scripts/hna/build_permits.py --refresh
          else
            python3 scripts/hna/build_permits.py --refresh-recent
          fi

      - name: Build place projections (permit-share blend)
        run: python3 scripts/hna/build_place_projections.py

      - name: Re-sync production-vs-need against fresh place projections
        # permits.json's per-place need block prefers places.json
        # (place_permit_blend), but places.json was itself just rebuilt from
        # the new permit SERIES above. This cache-only re-run (seconds, no
        # network) recomputes the need block against the fresh file so both
        # artifacts converge within one workflow run. Not circular:
        # places.json reads the permit series, never the need block.
        run: python3 scripts/hna/build_permits.py

      - name: Rebuild the derived chain
        # build_place_projections.py above rewrites
        # data/hna/projections/places.json, which is an INPUT to the ranking
        # index: scripts/hna/build_ranking_index.py loads it at
        # load_place_projections() and consumes it per jurisdiction. This
        # workflow used to rebuild place pages and stop, so every run left
        # data/hna/ranking-index.json describing projections that no longer
        # existed — and because a GITHUB_TOKEN push runs no workflows, nothing
        # said so until the next human push happened to run the suite, where
        # it presented as that PR failing on files it never touched.
        #
        # Measured 2026-09-20 (#1765): the 05:36Z HNA build produced a correct
        # index with all 72 metrics; the 09:25Z run of THIS workflow rewrote
        # places.json and left the index stale, and test:ranking-fresh failed
        # on the next merge with a diff of purely projection-derived fields
        # (future_units_needed_20yr, population_projection_20yr,
        # future_units_basis).
        #
        # rebuild:derived, never a hand-picked subset: the index has three
        # producers and running build_ranking_index.py alone drops the two
        # augmenters' contribution (#1698, #1729). Step 8 of the chain is
        # build_place_pages.py, so the place-page rebuild this replaces still
        # happens, in its correct position.
        run: npm run rebuild:derived

      - name: Validate data bounds
        run: node scripts/validate-critical-data.js

      - name: Benchmarks sanity (informational)
        # Exits nonzero only when repo data is missing/unparseable.
        run: python3 scripts/hna/check_benchmarks.py

      - name: Commit refreshed permits chain
        id: data-commit
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          # The permits paths, PLUS everything rebuild:derived writes. Without
          # the second half the chain would run and its output would be thrown
          # away unpushed, which is indistinguishable from not running it.
          # Measured from a full chain run on 2026-09-20 (#1765).
          paths="data/hna/permits.json data/hna/source/bps data/hna/projections/places.json places/ data/hna/ranking-index.json data/hna/ranking-scenarios data/hna/jurisdiction-metrics-digest data/hna/ownership-need.json data/jurisdiction-briefs data/home-snapshot.json data/paper working-paper.html methods.html AGENTS.md README.md data/_manifest.json data/manifest.json"
          # A path the chain starts writing that is missing from the list above
          # would be silently dropped, which is the defect this fixes. Fail loudly
          # instead.
          # `:!x` rather than `:(exclude)x`: the parenthesised form is a glob
          # pattern in some shells and silently stops excluding anything.
          excludes=""
          for p in $paths; do excludes="$excludes :!$p"; done
          outside="$(git status --porcelain -- . $excludes | head -20)"
          if [ -n "$outside" ]; then
            echo "::error::rebuild:derived wrote files outside the committed path list:" >&2
            echo "$outside" >&2
            echo "Add them to \$paths and to PATHS below, or stop writing them." >&2
            exit 1
          fi
          if git diff --quiet -- $paths && [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "BPS permits chain unchanged — nothing to commit."
            exit 0
          fi
          if python3 - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          TARGETS = {
              "data/hna/permits.json",
              "data/hna/projections/places.json",
          }
          PATHS = [
              "data/hna/permits.json",
              "data/hna/source/bps",
              "data/hna/projections/places.json",
              "places/",
              "data/hna/ranking-index.json",
              "data/hna/ranking-scenarios",
              "data/hna/jurisdiction-metrics-digest",
              "data/hna/ownership-need.json",
              "data/jurisdiction-briefs",
              "data/home-snapshot.json",
              "data/paper",
              "working-paper.html",
              "methods.html",
              "AGENTS.md",
              "README.md",
              "data/_manifest.json",
              "data/manifest.json",
          ]

          def run(args):
              return subprocess.run(
                  args,
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout

          def strip_generated_at(value):
              if isinstance(value, dict):
                  return {
                      key: strip_generated_at(child)
                      for key, child in value.items()
                      if key != "generated_at"
                  }
              if isinstance(value, list):
                  return [strip_generated_at(child) for child in value]
              return value

          status = run(["git", "status", "--porcelain", "--", *PATHS])
          changed = {line[3:] for line in status.splitlines() if line.strip()}
          if changed != TARGETS:
              sys.exit(1)

          for rel in TARGETS:
              current = json.loads(Path(rel).read_text())
              head = json.loads(run(["git", "show", f"HEAD:{rel}"]))
              if strip_generated_at(current) != strip_generated_at(head):
                  sys.exit(1)

          sys.exit(0)
          PY
          then
            echo "Only permits/projections generated_at timestamps changed — skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $paths
          # Multi-line commit message via tmpfile + `git commit -F` — a
          # quoted multi-line -m string inside a block scalar broke YAML
          # parsing on sync-data-mtimes/place-od-flows (F157/F158).
          msg=$(mktemp)
          {
            printf 'chore(data): rebuild BPS permits chain\n\n'
            printf 'Automated by .github/workflows/rebuild-bps-permits.yml — refreshes\n'
            printf 'permits.json from Census BPS annual files, re-syncs the DOLA-based\n'
            printf 'production_vs_need figures, rebuilds projections/places.json, and\n'
            printf 'regenerates the place pages that embed both.\n'
          } > "$msg"
          git commit -F "$msg"
          rm -f "$msg"
          if [ "${{ github.ref_name }}" = "main" ]; then
            git fetch origin main
            git rebase --autostash origin/main
          fi
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.data-commit.outputs.pushed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            core.notice('Dispatched deploy.yml for BPS permits commit.');
