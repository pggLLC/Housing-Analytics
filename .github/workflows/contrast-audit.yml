name: Site-Wide WCAG Contrast Audit

on:
  schedule:
    - cron: '41 2 * * 0'   # Sundays 02:41 UTC
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # Contrast can only change when something renderable changes: stylesheets,
    # markup, or the JS that injects inline colors. Data-, test-, script-, and
    # docs-only PRs cannot affect contrast, so they skip this ~6-min audit.
    # push (main) + the weekly cron still run it unfiltered, so main is always
    # fully covered regardless of how a change reaches it.
    paths:
      - 'css/**'
      - '**/*.html'
      - 'js/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  contrast-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Environment diagnostics
        run: |
          echo "── Node.js version ──"
          node --version
          echo "── npm version ──"
          npm --version
          echo "── Run context ──"
          echo "  Repository : $GITHUB_REPOSITORY"
          echo "  Run ID     : $GITHUB_RUN_ID"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium


      - name: Discover HTML pages
        id: discover
        run: |
          pages=$(find . -maxdepth 1 -name "*.html" -not -path "./.git/*" | sort | sed 's|^\./||')
          echo "Found HTML pages:"
          echo "$pages"
          # Store as newline-delimited list in an env file
          echo "PAGES<<EOF" >> "$GITHUB_ENV"
          echo "$pages" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          count=$(echo "$pages" | grep -c '\.html' || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Start local HTTP server
        run: npx http-server . -p 8080 --silent &
        env:
          CONTRAST_BASE_URL: http://localhost:8080

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:8080 --timeout 15000

      - name: Run Stage 3 WCAG Accessibility Gate (46 checks)
        id: wcag-gate
        run: |
          pip install pytest --quiet
          pytest tests/test_stage3_accessibility.py -v --tb=short \
            2>&1 | tee wcag-test-output.txt
          
          # Extract final score from pytest output
          SCORE=$(grep -o "WCAG COMPLIANCE SCORE: [0-9]*%" wcag-test-output.txt | tail -1)
          if [ -z "$SCORE" ]; then
            SCORE="UNKNOWN"
          fi
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          
          # Count passed/failed
          PASSED=$(grep -o "passed" wcag-test-output.txt | wc -l)
          FAILED=$(grep -o "failed" wcag-test-output.txt | wc -l)
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Run contrast audit on each page
        id: audit
        run: |
          mkdir -p contrast-reports
          summary_file="contrast-reports/summary.md"

          echo "# WCAG Contrast Audit Report" > "$summary_file"
          echo "" >> "$summary_file"
          echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$summary_file"
          echo "" >> "$summary_file"
          echo "## WCAG Accessibility Gate (Stage 3)" >> "$summary_file"
          echo "" >> "$summary_file"
          echo "- **WCAG Compliance Score:** ${{ steps.wcag-gate.outputs.score }}" >> "$summary_file"
          echo "- **Pytest Status:** ${{ steps.wcag-gate.outcome }}" >> "$summary_file"
          echo "" >> "$summary_file"
          echo "## Contrast Audit Results" >> "$summary_file"
          echo "" >> "$summary_file"
          while IFS= read -r page; do
            [ -z "$page" ] && continue
            page_name="${page%.html}"
            report_file="contrast-reports/${page_name//\//-}.json"

            echo "Auditing: $page"

            # Run the Playwright-based contrast audit for this page.
            # CONTRAST_FIX=1 applies fixes in-browser and records before/after ratios.
            # CONTRAST_REPORT_FILE writes the JSON report. The table below is
            # built from those reports, not from the exit code: exit 0 no
            # longer means "passed" when a page could not be scanned.
            CONTRAST_BASE_URL="http://localhost:8080" \
            CONTRAST_PAGE="$page" \
            CONTRAST_FIX=1 \
            CONTRAST_REPORT_FILE="$report_file" \
            node scripts/contrast-audit/run.js || true
          done <<< "$PAGES"

          printf '%s\n' "$PAGES" > contrast-reports/pages.txt
          node scripts/contrast-audit/summarize.js contrast-reports contrast-reports/pages.txt >> "$summary_file"

          not_scanned=$(grep -c '⚠️ Not scanned' "$summary_file" || true)
          if [ "$not_scanned" -gt 0 ]; then
            echo "::warning title=Contrast audit::$not_scanned page(s) could not be scanned -- see contrast-reports/summary.md"
          fi

          cat "$summary_file"

      # F159 — Runtime DOM contrast scanner. This is the STRONGEST gate
      # we have: it loads every HTML page in headless Chrome via
      # puppeteer, forces both light AND dark mode classes, walks every
      # visible text node, and computes the real foreground/effective-bg
      # contrast ratio at the rendered DOM level. Existing pytest +
      # per-page playwright steps are STATIC (they verify CSS tokens are
      # in place + the design-system contract holds) — they can't catch
      # an inline `style="color:#888"` that lands on an unexpected bg via
      # cascade, or a JS-injected element whose color depends on theme
      # state the static tests don't model. The runtime scanner does.
      # Scanner exits 1 on any failure → workflow fails → blocks the PR.

      - name: Validate accessibility compliance
        if: failure()
        run: |
          echo "❌ WCAG Accessibility Gate FAILED"
          echo "   Stage-3 pytest or the per-page Playwright audit reported failures."
          echo "   Review wcag-test-output.txt and contrast-reports/summary.md."
          echo "   (The runtime DOM scanner runs in its own job: runtime-contrast-scan.)"
          exit 1

      - name: Upload audit reports and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-audit-results
          path: |
            contrast-reports/
            wcag-test-output.txt
          retention-days: 30

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'contrast-reports/summary.md';
            const wcagOutputPath = 'wcag-test-output.txt';

            const summaryText = fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8') : '';
            // The heading's mark follows the table: a failed or unscanned page is not a ✅.
            const clean = summaryText && !/❌ Fail|⚠️ Not scanned/.test(summaryText);
            let body = '## ' + (clean ? '✅' : '⚠️') + ' WCAG 2.1 AA Accessibility & Contrast Audit\n\n';

            // Include WCAG test results summary
            if (fs.existsSync(wcagOutputPath)) {
              const wcagOutput = fs.readFileSync(wcagOutputPath, 'utf8');
              const scoreMatch = wcagOutput.match(/WCAG COMPLIANCE SCORE: (\d+%)/);
              const testMatch = wcagOutput.match(/(\d+) passed/);

              body += '### 🎯 WCAG Compliance Gate\n';
              body += scoreMatch ? `- **Compliance Score:** ${scoreMatch[1]}\n` : '- **Compliance Score:** Unknown\n';
              body += testMatch ? `- **Tests Passed:** ${testMatch[1]}/46\n` : '- **Tests Passed:** Unknown\n';
              body += '\n';
            }

            body += '### 📊 Contrast Audit Results\n\n';
            if (summaryText) {
              body += summaryText;
            } else {
              body += '_No summary report generated._';
            }

            body += '\n\n_Audit run on commit ' + context.sha.slice(0, 7) + '_';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      # The scripts/monitoring/alert.js step was removed when this workflow moved to
      # the external monitor (.github/workflows/workflow-outcome-monitor.yml).
      #
      # It never produced anything. alert.js opens an issue only when GITHUB_TOKEN is
      # in the environment, and actions/github-script exposes a token on its client
      # object rather than exporting one -- so `{ ...process.env }` inherited an
      # environment that never had it. Zero issues in this repository's history match
      # alert.js's title formats, across fifteen callers.

  # F159 runtime DOM contrast scanner, in its own job (#1819). It used to run
  # third in the job above, after the Playwright per-page audit and the
  # Stage-3 pytest gate, with their browser processes and a second
  # http-server still alive — the only condition under which it has ever
  # hung (twice on 2026-09-22, both killed at the 30-minute cap; fourteen
  # isolated runs of the same scanner on the same Chrome never did). A job
  # of its own gives it a clean runner, and the two audits report
  # separately instead of one grey cancel hiding the other's result.
  runtime-contrast-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Puppeteer-bundled Chrome
        # `npm ci` can run with scripts disabled, so puppeteer's postinstall
        # download is not guaranteed; install the pinned Chrome explicitly.
        run: npx puppeteer browsers install chrome
      - name: Run runtime DOM contrast scanner (every page × light + dark)
        env:
          PUPPETEER_DOWNLOAD_BASE_URL: https://storage.googleapis.com/chrome-for-testing-public
        run: |
          echo "── Running site-wide WCAG 4.5:1 / 3:1 runtime contrast scan ──"
          node scripts/audit/runtime-contrast-scanner.mjs
          echo "── Runtime scan complete ──"
      - name: Upload runtime scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-contrast-scan
          path: audit-report/runtime-contrast/
          retention-days: 30
