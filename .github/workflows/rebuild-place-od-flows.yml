name: Rebuild Place and Tract OD Flows

# Monthly rebuild of block-classified LEHD LODES origin-destination flows:
# - data/hna/place-od-flows.json, aggregated to place and consumed by HNA /
#   OF / PMA context surfaces.
# - data/market/lodes_tract_od_co.json, exact tract-to-tract context substrate
#   for the future D-full commute-shaped PMA mode. Context-only; no scoring
#   consumer is wired by this workflow.
#
# LODES releases new OD files annually around mid-summer. A monthly run
# is enough cadence to pick up new vintages without burning bandwidth on
# the ~2.45M block-block rows every day.

on:
  # First of every month at 08:13 UTC = 02:13 America/Denver in DST.
  schedule:
    - cron: '31 6 1 * *'   # 1st of each month, 06:31 UTC (lands ~03:00 MT)
  # Also rebuild when the script or its dependencies change.
  push:
    branches: ['main']
    paths:
      - 'scripts/hna/build_place_od_flows.py'
      - 'scripts/hna/build_tract_od_matrix.py'
      - '.github/workflows/rebuild-place-od-flows.yml'
  workflow_dispatch:
    inputs:
      year:
        description: 'LODES OD year (e.g. 2023, 2022)'
        required: false
        default: '2023'

permissions:
  contents: write
  actions: write

concurrency:
  group: data-commits
  cancel-in-progress: false
  # Hold every waiting run. Without this GitHub keeps one pending run per
  # group and silently cancels the others (10 dropped data runs, Aug-Oct 2026).
  queue: max

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # 2.45M row stream + parquet read can take several minutes on a cold runner.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
          # If the script needs more deps, add to a requirements file later.

      - name: Build place-OD flows
        env:
          YEAR: ${{ inputs.year || '2023' }}
        run: |
          python scripts/hna/build_place_od_flows.py --year "$YEAR"
          python scripts/hna/build_tract_od_matrix.py --year "$YEAR"

      - name: Commit refreshed flows
        id: data-commit
        # The shared script commits only these two files, rebases, then rebuilds
        # both manifests from the rebased tree. This step used to build
        # data/manifest.json first and rebase after, so any commit landing on
        # main while it ran conflicted on the manifest: the 2026-10-16 and
        # 2026-11-01 runs failed that way and pushed nothing. Neither file
        # feeds the derived chain, so the chain is not needed here.
        env:
          DATA_COMMIT_BRANCH: ${{ github.ref_name }}
          YEAR: ${{ inputs.year || '2023' }}
        run: |
          scripts/push-data-commit.sh "chore(data): rebuild place-OD flows (LEHD LODES OD $YEAR)" -- \
            data/hna/place-od-flows.json data/market/lodes_tract_od_co.json

      - name: Trigger Pages deploy
        if: steps.data-commit.outputs.pushed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            core.notice('Dispatched deploy.yml for OD flow data commit.');
