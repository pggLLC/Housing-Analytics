name: Fetch Polymarket Data

on:
  schedule:
    - cron: '37 5 * * *'   # daily 05:37 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Fetch Polymarket prediction market data
        run: |
          echo "── Starting Polymarket fetch at $(date -u) ──"
          python3 - <<'PY'
          import json, sys, time, datetime, urllib.request, urllib.error
          from pathlib import Path

          API = "https://gamma-api.polymarket.com"

          # A CURATED list, because relevance on a housing site is a human
          # judgement -- a title scan for "rent" matches Brentford FC and the
          # word "different". What must NOT be human-maintained is liveness:
          # every entry below will resolve eventually, and several of these
          # resolve monthly.
          #
          # Before 2026-09-18 this list was 15 slugs fetched unconditionally
          # forever. Nine had resolved, including all three housing markets,
          # and the panel published them as live prices. See issue #1738.
          EVENTS = [
              # macro
              "us-recession-by-end-of-2026",
              "how-many-fed-rate-cuts-in-2026",
              "how-high-will-inflation-get-in-2026",
              "gdp-growth-in-2026",
              "tech-layoffs-up-or-down-in-2026",
              "fed-decision-in-october-20260617190323537",
              "fed-decision-in-january-20260729233815502",
              # housing -- the reason this panel is on this site at all
              "will-the-30-year-mortgage-rate-hit-in-2026",
          ]

          # Anything matching this in an event title counts as housing content.
          # Word-boundaried on purpose.
          import re
          HOUSING = re.compile(r"\b(home value|home prices?|housing|mortgage rate|rents?)\b", re.I)

          def fetch_event(slug):
              url = f"{API}/events?slug={slug}"
              # An empty API response is not evidence of settlement. Retry it
              # like a transport failure; preserve only that entry if still missing.
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "housing-analytics-bot/1.0"})
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          data = json.loads(resp.read().decode())
                          event = next((e for e in data if e.get("slug") == slug), None)
                          if event:
                              return event
                  except Exception as e:
                      print(f"  WARN: {slug}: {e}", file=sys.stderr)
                  if attempt < 2:
                      print(f"  RETRY ({slug} not returned)")
                      time.sleep(attempt + 1)
              return None

          now = datetime.datetime.now(datetime.timezone.utc)

          def is_settled(event):
              """Closed, or past its end date. Returns (bool, reason).

              `closed` is the signal; `active` is NOT. Every one of the nine
              settled events in #1738 had active=True alongside closed=True,
              so treating `active` as liveness would have kept all of them.
              """
              if event.get("closed") is True:
                  return True, "closed"
              end = event.get("endDate")
              if end:
                  try:
                      if datetime.datetime.fromisoformat(str(end).replace("Z", "+00:00")) < now:
                          return True, f"ended {str(end)[:10]}"
                  except ValueError:
                      pass
              return False, ""

          out_path = "data/polymarket-data.json"
          previous = json.loads(Path(out_path).read_text()) if Path(out_path).exists() else {}
          stamp = now.isoformat().replace("+00:00", "Z")
          results, dropped, missing = {}, [], []
          missing_since = {}
          for slug in EVENTS:
              print(f"  Fetching {slug}...", end=" ")
              event = fetch_event(slug)
              if not event:
                  print("MISSING (not returned after retries)")
                  missing.append(slug)
                  old = (previous.get("events") or {}).get(slug)
                  since = ((old or {}).get("stale_since")
                           or (previous.get("missing_since") or {}).get(slug) or stamp)
                  missing_since[slug] = since
                  if old:
                      settled, why = is_settled(old)
                      if settled:
                          dropped.append((slug, why))
                      else:
                          results[slug] = dict(old, stale_since=since)
                  if now - datetime.datetime.fromisoformat(since.replace("Z", "+00:00")) > datetime.timedelta(days=3):
                      print(f"::error::{slug} missing since {since} (more than 3 days)")
                  continue
              settled, why = is_settled(event)
              if settled:
                  print(f"DROP ({why})")
                  dropped.append((slug, why))
                  continue
              markets = []
              for m in (event.get("markets") or []):
                  markets.append({
                      "question": m.get("groupItemTitle") or m.get("question", ""),
                      "outcomePrices": m.get("outcomePrices", "[]"),
                      "volume": m.get("volume", "0"),
                      "outcomes": m.get("outcomes", ""),
                  })
              results[slug] = {
                  "title": event.get("title", slug),
                  "slug": slug,
                  # Kept so a reader -- and the guard -- can tell a live market
                  # from one that resolved between cron runs. The previous
                  # version dropped these "to keep the file small", which left
                  # the site inferring settlement from price extremes alone.
                  "endDate": event.get("endDate"),
                  "closed": bool(event.get("closed")),
                  "closedTime": event.get("closedTime"),
                  "markets": markets,
              }
              print("OK")

          housing = [e for e in results.values() if HOUSING.search(e["title"] or "")]

          print("")
          print(f"── kept {len(results)}  ·  dropped {len(dropped)}  ·  not returned {len(missing)} ──")
          for slug, why in dropped:
              print(f"   dropped: {slug} ({why})")
          for slug in missing:
              print(f"   missing: {slug}")
          print(f"   housing markets remaining: {len(housing)}")

          if len(missing) == len(EVENTS):
              print("::error::every Polymarket event is missing; keeping the existing cache unchanged")
              sys.exit(1)

          # Successful responses (including confirmed removals) are published
          # even when another event is missing. Old prices stay explicitly stale.
          if not housing:
              print("::warning::no housing-related Polymarket market is live; this panel is "
                    "on a housing site. Add a successor market to EVENTS in this workflow.")

          output = {
              "updated": stamp,
              "source": "Polymarket Gamma API",
              "event_count": len(results),
              "curated_count": len(EVENTS),
              "dropped_settled": [s for s, _ in dropped],
              "missing_since": missing_since,
              "events": results,
          }

          with open(out_path, "w") as f:
              json.dump(output, f, indent=2)
          print(f"\n── Wrote {out_path} with {len(results)}/{len(EVENTS)} cached events ──")
          PY

      - name: Commit and push if changed
        id: data-commit
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/rebuild_manifest.py
          git add data/polymarket-data.json data/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update cached Polymarket prediction market data"
          if [ "${{ github.ref_name }}" = "main" ]; then
            git fetch origin main
            git rebase --autostash origin/main
          fi
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.data-commit.outputs.pushed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            core.notice('Dispatched deploy.yml for Polymarket data commit.');
