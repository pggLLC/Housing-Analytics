name: Fetch Parcel & Zoning Data

# Builds the parcel aggregates, zoning compatibility index, transit routes,
# and school boundaries that power the PMA Parcel & Zoning map overlay.
#
# Data files written:
#   data/market/parcel_aggregates_co.json   — county parcel aggregates
#   data/market/zoning_compat_index_co.json — multifamily zoning compat index
#   data/market/transit_routes_co.geojson   — GTFS transit routes (RTD + others)
#   data/market/schools_co.geojson          — school locations + CDE ratings
#
# Sources (all free/public):
#   Parcel data:  Colorado county assessors via DOLA ArcGIS REST endpoints
#   Zoning data:  DOLA Zoning Atlas + OpenStreetMap Overpass API landuse
#   Transit:      RTD GTFS feed (https://www.rtd-denver.com/open-data) +
#                 other CO transit agencies via transitfeeds.com
#   Schools:      Colorado Dept of Education ArcGIS service
#
# Regrid live parcel API is an optional paid licensed source, deferred for
# cost by owner decision (#1612). Scheduled requests remain off until the
# repository variable REGRID_ENABLED=true; a one-off run can opt in with the
# regrid_enabled dispatch input. Both paths also require REGRID_API_KEY.
#
# Schedule: Sundays at 02:17 UTC. market_data_build.yml now runs on
# Saturdays, so the two no longer contend for runners at all.

on:
  schedule:
    - cron: '17 5 * * 0'   # Sundays 05:17 UTC (lands ~02:00 MT)
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force refresh even if cache appears fresh'
        required: false
        default: 'false'
      regrid_enabled:
        description: 'Run the Regrid pipeline scan (optional paid licensed source, deferred for cost — #1612). Requires the REGRID_API_KEY secret; without it the script writes a deferred stub.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  fetch-parcel-zoning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Scheduled Regrid requests resume only by explicit owner opt-in.
      # One-off: dispatch with regrid_enabled=true. Scheduled: set the
      # repository variable REGRID_ENABLED=true. Both require a funded token.
      REGRID_ENABLED: ${{ vars.REGRID_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.regrid_enabled == true) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install requests shapely pyproj 2>&1 | tail -5

      # ── Parcel aggregates ─────────────────────────────────────────────
      - name: Fetch parcel aggregates (DOLA + county assessors)
        # This county-assessor script never reads Regrid credentials.
        run: |
          python scripts/market/fetch_parcel_data.py 2>&1 | tee /tmp/parcel_build.log
          echo "Exit code: $?"
        continue-on-error: true

      - name: Validate parcel aggregates
        run: |
          python - <<'PYEOF'
          import json, sys, os
          path = 'data/market/parcel_aggregates_co.json'
          if not os.path.exists(path):
            print('::warning::parcel_aggregates_co.json was not created; using empty stub')
            stub = {"meta": {"generated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "source": "stub"}, "counties": []}
            with open(path, 'w') as f: json.dump(stub, f)
            sys.exit(0)
          with open(path) as f:
            data = json.load(f)
          counties = data.get('counties', [])
          print(f'parcel_aggregates_co.json: {len(counties)} counties')
          if len(counties) == 0:
            print('::warning::parcel_aggregates_co.json has 0 counties — data may be a stub')
          PYEOF

      # ── F246 / F258 — Per-pipeline-jurisdiction Regrid parcel scan ────
      # F246 wired this step against the Regrid v2 API to pre-fetch ~3-mi
      # parcel data for every IndiBuild pipeline jurisdiction so the
      # IndiBuild Brief's "Scan parcels" UI worked without a per-browser
      # API key.
      #
      # F258 / #1612: Regrid is an optional paid licensed source and access
      # is not funded. Scheduled runs skip this step unless the owner sets
      # repository variable REGRID_ENABLED=true. A one-off run may instead
      # use workflow_dispatch with regrid_enabled=true. Both reactivation
      # paths require REGRID_API_KEY and the private pipeline CSV supplied
      # through REGRID_PIPELINE_CSV or restored to its documented path.
      - name: Fetch Regrid parcels for pipeline jurisdictions
        if: env.REGRID_ENABLED == 'true'
        env:
          REGRID_API_KEY: ${{ secrets.REGRID_API_KEY }}
        run: |
          set -o pipefail
          python scripts/market/fetch_regrid_pipeline_parcels.py 2>&1 | tee /tmp/regrid_pipeline.log
          echo "Exit code: $?"
        continue-on-error: true

      - name: Validate pipeline Regrid cache
        if: env.REGRID_ENABLED == 'true'
        run: |
          python - <<'PYEOF'
          import json, os
          path = 'data/affordable-housing/regrid-parcels-by-place.json'
          if not os.path.exists(path):
            print('::warning::regrid-parcels-by-place.json was not created')
          else:
            with open(path) as f:
              data = json.load(f)
            meta = data.get('meta', {})
            availability = meta.get('availability')
            print(f"regrid pipeline cache: {meta.get('jurisdiction_count', 0)} jurisdictions, "
                  f"{meta.get('total_parcels')} parcels, "
                  f"{meta.get('api_calls', 0)} API calls "
                  f"(source: {meta.get('source', 'unknown')})")
            if availability == 'active' and (meta.get('api_calls', 0) == 0 or not meta.get('total_parcels')):
              print('::warning::Regrid cache says active but recorded no successful parcels')
            elif availability == 'failed':
              print(f"::warning::{meta.get('unavailableReason', 'Regrid requests failed')}")
            elif availability == 'deferred':
              print(meta.get('unavailableReason', 'Regrid access deferred'))
          PYEOF

      - name: Regrid pipeline scan — deferred (no request made)
        if: env.REGRID_ENABLED != 'true'
        run: |
          echo "::notice::Regrid pipeline scan skipped. Regrid is an optional paid licensed source and access is not funded (#1612). No Regrid request was made; data/affordable-housing/regrid-parcels-by-place.json is unchanged. To run it: dispatch this workflow with regrid_enabled=true, or set repository variable REGRID_ENABLED=true."

      # ── Zoning compatibility index ────────────────────────────────────
      - name: Fetch zoning compatibility index (DOLA + OSM)
        run: |
          python scripts/market/fetch_zoning.py 2>&1 | tee /tmp/zoning_build.log
          echo "Exit code: $?"
        continue-on-error: true

      - name: Validate zoning index
        run: |
          python - <<'PYEOF'
          import json, sys, os
          path = 'data/market/zoning_compat_index_co.json'
          if not os.path.exists(path):
            print('::warning::zoning_compat_index_co.json was not created; using empty stub')
            stub = {
              "meta": {"generated": "stub", "compat_score_scale": "0 (no MF) to 2.5 (unrestricted MF)"},
              "jurisdictions": []
            }
            with open(path, 'w') as f: json.dump(stub, f)
            sys.exit(0)
          with open(path) as f:
            data = json.load(f)
          juris = data.get('jurisdictions', [])
          print(f'zoning_compat_index_co.json: {len(juris)} jurisdictions')
          if len(juris) == 0:
            print('::warning::zoning_compat_index_co.json has 0 jurisdictions — data may be a stub')
          PYEOF

      # ── Transit routes (GTFS) ─────────────────────────────────────────
      - name: Fetch transit routes (RTD GTFS + CO agencies)
        run: |
          python scripts/market/fetch_gtfs_transit.py 2>&1 | tee /tmp/transit_build.log
          echo "Exit code: $?"
        continue-on-error: true

      - name: Validate transit routes
        run: |
          python - <<'PYEOF'
          import json, sys, os
          path = 'data/market/transit_routes_co.geojson'
          if not os.path.exists(path):
            print('::warning::transit_routes_co.geojson not created; using empty stub')
            stub = {"type": "FeatureCollection", "features": []}
            with open(path, 'w') as f: json.dump(stub, f)
            sys.exit(0)
          with open(path) as f:
            data = json.load(f)
          count = len(data.get('features', []))
          print(f'transit_routes_co.geojson: {count} route features')
          PYEOF

      # ── School locations ──────────────────────────────────────────────
      - name: Fetch school locations (CDE ArcGIS)
        run: |
          python scripts/market/fetch_schools.py 2>&1 | tee /tmp/schools_build.log
          echo "Exit code: $?"
        continue-on-error: true

      - name: Validate schools data
        run: |
          python - <<'PYEOF'
          import json, sys, os
          path = 'data/market/schools_co.geojson'
          if not os.path.exists(path):
            print('::warning::schools_co.geojson not created; using empty stub')
            stub = {"type": "FeatureCollection", "features": []}
            with open(path, 'w') as f: json.dump(stub, f)
            sys.exit(0)
          with open(path) as f:
            data = json.load(f)
          count = len(data.get('features', []))
          print(f'schools_co.geojson: {count} schools')
          PYEOF

      # ── Opportunity Zones (refresh) ───────────────────────────────────
      - name: Refresh Opportunity Zone designations
        run: |
          python scripts/market/fetch_opportunity_zones.py 2>&1 | tee /tmp/oz_build.log
          echo "Exit code: $?"
        continue-on-error: true

      - name: Simplify changed browser map geometry
        run: |
          if ! git diff --quiet -- data/market/transit_routes_co.geojson; then
            node scripts/simplify-geojson.mjs --input data/market/transit_routes_co.geojson --keep 1.5 --fields agency,route_type,shape_id --no-repair
          fi
          if ! git diff --quiet -- data/market/opportunity_zones_co.geojson; then
            node scripts/simplify-geojson.mjs --input data/market/opportunity_zones_co.geojson --keep 20 --fields county_fips,designated,geoid
          fi

      # ── Commit all updated data ───────────────────────────────────────
      - name: Commit updated data files
        id: data-commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/rebuild_manifest.py
          git add data/market/parcel_aggregates_co.json \
                  data/market/zoning_compat_index_co.json \
                  data/market/transit_routes_co.geojson \
                  data/market/schools_co.geojson \
                  data/market/opportunity_zones_co.geojson \
                  data/affordable-housing/regrid-parcels-by-place.json \
                  data/manifest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(git diff --cached --name-only | wc -l)
            git commit -m "chore: refresh parcel/zoning/transit/schools data ($COUNT files) [skip ci]"
            git pull --rebase --autostash -X theirs origin main
            python3 scripts/rebuild_manifest.py
            if ! git diff --quiet -- data/; then
              git add data/
              git commit --amend --no-edit
            fi
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Bot pushes with [skip ci] do not trigger deploy.yml automatically.
      - name: Trigger Pages deploy
        if: steps.data-commit.outputs.pushed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            core.notice('Dispatched deploy.yml for parcel/zoning data refresh.');
