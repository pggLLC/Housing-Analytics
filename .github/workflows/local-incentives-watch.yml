name: Local incentives watch

# Opens one issue a month for the Local Housing Incentives page
# (local-incentives.html): the next jurisdictions to research, in priority
# order, and a hand refresh of the Prop 123 filing list when it is older than
# 120 days (DOLA's page refuses automated reads). Re-checks of records that
# come due are opened daily by policy-review-reminders.yml.
# Commits nothing. Monthly, off :00 and off every minute other crons use.

on:
  schedule:
    - cron: '57 8 3 * *'   # 3rd of each month, 08:57 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the issue without creating it
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/local-incentives-watch.yml'
      - 'scripts/audit/local-incentives-watch.mjs'
      - 'js/local-incentives-data.js'

permissions: { contents: read, issues: write }

concurrency:
  group: local-incentives-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Scheduled runs check out main. A pull request reads its own data,
      # so a PR that adds or reshapes an incentive file is tested against it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Open this month's issue (branch and PR runs are always dry)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || inputs.dry_run == true }}
        run: |
          args=(--repo-root .)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/audit/local-incentives-watch.mjs "${args[@]}"
