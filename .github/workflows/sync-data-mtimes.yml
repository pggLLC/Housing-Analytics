name: Sync Data MTimes

# Keep js/data-source-inventory.js + DATA-MANIFEST.json `lastUpdated` /
# `last_update` fields synced to the actual file mtimes on disk. Without
# this, the dashboard's stale count drifts on every refresh-pipeline run
# because the cached files get newer but the declared timestamps stay
# pinned (that's how the Stale 39 → 18 / 45 → 24 first run happened).
#
# The inventory step also recomputes `features:` from the committed data
# files, for the sources listed in scripts/audit/inventory-count-paths.cjs.
# test/data-source-inventory-drift.test.js asserts those counts exactly, so
# an append-only series turned main red as soon as it grew a record —
# `fred-mortgage30` gains one observation a week and did exactly that on
# 2026-09-11, after PRs #1569 and #1593 had each reconciled it by hand.
#
# Runs:
#   - daily at 03:53 UTC so the fix is in main before anyone reads the
#     dashboard at 10am Denver. It used to run at 16:30 UTC, which IS
#     10:30 Denver — after the moment the comment was aiming at, and with
#     queue delay it landed nearer 13:30. Running overnight finally meets
#     the stated goal, and it still precedes the daily freshness check.
#   - on push to data/** so manual updates also flush through
#   - on manual dispatch when something needs nudging
#
# The sync scripts themselves are non-blocking: if one fails we don't want
# to block a data refresh PR. The *verification* is not — its outcome is
# captured and re-raised as the job's final step, so automatic corrections
# still land but residual drift ends the run red. That matters because a
# GITHUB_TOKEN push does not trigger ci-checks, so nothing else would report
# it. The drift test still gates every PR; this job keeps the data honest
# and never relaxes the gate.

on:
  schedule:
    - cron: '53 3 * * *'   # daily 03:53 UTC
  push:
    branches: ['main']
    paths:
      - 'data/**'
      - 'scripts/audit/sync-manifest-mtimes.mjs'
      - 'scripts/audit/refresh-inventory-mtimes.mjs'
      - 'scripts/audit/inventory-count-paths.cjs'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Need full history so the auto-commit step can push back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sync DATA-MANIFEST.json last_update fields
        run: node scripts/audit/sync-manifest-mtimes.mjs

      # Runs after the manifest sync on purpose: the `data-manifest` source
      # counts DATA-MANIFEST.json's own `files` collection, so it has to read
      # the manifest the previous step just wrote.
      - name: Sync data-source-inventory.js lastUpdated + features fields
        run: node scripts/audit/refresh-inventory-mtimes.mjs

      # Non-blocking *at this point* so drift this script can't reconcile (a
      # COUNTY_DIRECTORY_IDS directory, a GeoJSON feature array) doesn't abort
      # the job before the commit step and strand the corrections that did
      # succeed. The outcome is captured and re-raised as the final step, so
      # the run still ends red — see "Fail the run if verification failed".
      #
      # This workflow has to police itself. An earlier version of this comment
      # claimed "the gate proper runs in CI on the resulting commit", which is
      # false: the commit below is pushed with GITHUB_TOKEN, and GitHub does
      # not trigger workflows for such pushes, so ci-checks never runs on it.
      # Confirmed against 969841723, 25a9b27aa and ab58e936d — none of them
      # has a ci-checks run. AGENTS.md records the same trap: "Data crons
      # suppress CI on their own commits, so main can be broken for hours with
      # no failing run to show for it."
      - name: Verify inventory reconciles against committed data
        id: verify-inventory
        continue-on-error: true
        run: npm run test:data-source-inventory-paths

      - name: Commit changes if any
        id: data-commit
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet js/data-source-inventory.js DATA-MANIFEST.json; then
            echo "No mtime or feature-count drift to fix today."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data-source-inventory.js DATA-MANIFEST.json
          # F157 — Was using a `git commit -m "…"` quoted string that spanned
          # multiple YAML lines unindented, which terminated the `run: |`
          # block scalar early and caused "Invalid workflow file: error in
          # yaml syntax on line 66". Build the message in a tmpfile via a
          # bash HEREDOC instead — every line stays inside the block scalar's
          # indentation envelope and the workflow parses cleanly.
          msg=$(mktemp)
          {
            printf 'chore(data): sync inventory mtimes + feature counts to on-disk files\n\n'
            printf 'Automated by .github/workflows/sync-data-mtimes.yml — keeps the\n'
            printf "dashboard's stale count honest by walking each tracked file's\n"
            printf 'actual mtime and rewriting the declared lastUpdated / last_update\n'
            printf 'stamp when on-disk is newer than declared, and recomputes the\n'
            printf 'features: count for each inventory source from its committed data\n'
            printf 'file so test/data-source-inventory-drift.test.js stays green as\n'
            printf 'append-only series grow.\n'
          } > "$msg"
          git commit -F "$msg"
          rm -f "$msg"
          if [ "${{ github.ref_name }}" = "main" ]; then
            git fetch origin main
            git rebase --autostash origin/main
          fi
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.data-commit.outputs.pushed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            core.notice('Dispatched deploy.yml for sync-data-mtimes commit.');

      # Re-raise the verification outcome captured above. Deliberately last:
      # the automatic corrections have already been committed, pushed and
      # deployed by now, so a failure here doesn't roll anything back — it
      # exists so residual drift can't end the run green with nothing
      # anywhere reporting that main is inconsistent.
      - name: Fail the run if verification failed
        if: always() && steps.verify-inventory.outcome == 'failure'
        run: |
          echo "::error::Inventory verification failed — main still carries drift this workflow could not reconcile automatically."
          echo "Any automatic corrections were still committed and pushed; this step only stops the run from reporting success."
          echo "Reproduce locally with: npm run test:data-source-inventory-paths"
          exit 1
