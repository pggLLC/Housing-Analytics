name: Sync Data MTimes

# Keep js/data-source-inventory.js + DATA-MANIFEST.json `lastUpdated` /
# `last_update` fields synced to the actual file mtimes on disk. Without
# this, the dashboard's stale count drifts on every refresh-pipeline run
# because the cached files get newer but the declared timestamps stay
# pinned (that's how the Stale 39 → 18 / 45 → 24 first run happened).
#
# The inventory step also recomputes `features:` from the committed data
# files, for the sources listed in scripts/audit/inventory-count-paths.cjs.
# test/data-source-inventory-drift.test.js asserts those counts exactly, so
# an append-only series turned main red as soon as it grew a record —
# `fred-mortgage30` gains one observation a week and did exactly that on
# 2026-09-11, after PRs #1569 and #1593 had each reconciled it by hand.
#
# Runs:
#   - daily at 03:53 UTC so the fix is in main before anyone reads the
#     dashboard at 10am Denver. It used to run at 16:30 UTC, which IS
#     10:30 Denver — after the moment the comment was aiming at, and with
#     queue delay it landed nearer 13:30. Running overnight finally meets
#     the stated goal, and it still precedes the daily freshness check.
#   - on push to data/** so manual updates also flush through
#   - on manual dispatch when something needs nudging
#
# The sync scripts themselves are non-blocking: if one fails we don't want
# to block a data refresh PR. The *verification* is not — its outcome is
# captured and re-raised as the job's final step, so automatic corrections
# still land but residual drift ends the run red. That matters because a
# GITHUB_TOKEN push does not trigger ci-checks, so nothing else would report
# it. The drift test still gates every PR; this job keeps the data honest
# and never relaxes the gate.

on:
  schedule:
    - cron: '53 3 * * *'   # daily 03:53 UTC
  push:
    branches: ['main']
    paths:
      - 'data/**'
      - 'scripts/audit/sync-manifest-mtimes.mjs'
      - 'scripts/audit/refresh-inventory-mtimes.mjs'
      - 'scripts/audit/inventory-count-paths.cjs'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Serialise against every other workflow that commits data to main. This job
# rebases its own derived commit onto origin/main, and that rebase conflicts
# outright when a second instance has already landed a commit touching the same
# two files — `set -e` then aborts mid-rebase and the run ends red.
#
# That is not hypothetical: run 34667255892 failed exactly this way on
# ed4a508cc, because #1598 and #1596 merged 12 seconds apart and each push
# started its own sync run. The script's header assumes "nothing upstream
# touched these two files"; a sibling instance of this same workflow does.
# The retry loop does not cover it — it catches a rejected push, not a
# conflicted rebase.
#
# `data-commits` is the group the other 29 data-committing workflows already
# share (data-refresh, build-hna-data, weekly_housing_brief, …); this one was
# the outlier. cancel-in-progress stays false so queued corrections still land
# rather than being dropped.
concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is load-bearing, not decoration. The commit step
          # rebases onto origin/main before pushing, and on the default shallow
          # clone (depth 1) that rebase has no guaranteed common ancestor to
          # work from once main has moved. The comment here used to claim "full
          # history" while this was unset — i.e. shallow.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sync DATA-MANIFEST.json last_update fields
        run: node scripts/audit/sync-manifest-mtimes.mjs

      # Runs after the manifest sync on purpose: the `data-manifest` source
      # counts DATA-MANIFEST.json's own `files` collection, so it has to read
      # the manifest the previous step just wrote.
      - name: Sync data-source-inventory.js lastUpdated + features fields
        run: node scripts/audit/refresh-inventory-mtimes.mjs

      # The commit/rebase/push cycle lives in a script so it can be tested
      # against real git repositories — see test/inventory-sync-push.test.js.
      # It re-reconciles after each rebase, because the numbers computed at
      # checkout describe a tree that main may have moved past, and this push
      # (GITHUB_TOKEN) does not trigger ci-checks to catch it.
      - name: Commit and land corrections
        id: data-commit
        run: bash scripts/audit/push-inventory-sync.sh "${{ github.ref_name }}"

      # Runs *after* the push so it verifies the tree that actually landed:
      # the re-reconcile inside the script above can change the numbers, so
      # verifying beforehand would attest to a state that was never pushed.
      #
      # Non-blocking at this point only so its outcome can be captured; it is
      # re-raised by the final step below, and by then the corrections have
      # already landed, so failing here rolls nothing back. It has to police
      # itself: this push uses GITHUB_TOKEN, and GitHub does not trigger
      # workflows for such pushes, so ci-checks never runs on the result.
      # Confirmed against 969841723, 25a9b27aa and ab58e936d — none has a
      # ci-checks run. AGENTS.md records the same trap: "Data crons suppress
      # CI on their own commits, so main can be broken for hours with no
      # failing run to show for it."
      - name: Verify inventory reconciles against committed data
        id: verify-inventory
        continue-on-error: true
        run: npm run test:data-source-inventory-paths

      # Gated on verification as well as on having pushed. The correction still
      # lands on main when verification fails — that is deliberate, and the
      # final step re-raises the failure — but publishing a tree we just proved
      # inconsistent to the public site is a separate decision, and the answer
      # is no. A drifted main is recoverable by the next run; a drifted deploy
      # is what visitors see in the meantime.
      - name: Trigger Pages deploy
        if: steps.data-commit.outputs.pushed == 'true' && steps.verify-inventory.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            core.notice('Dispatched deploy.yml for sync-data-mtimes commit.');

      # Re-raise the verification outcome captured above. Deliberately last:
      # the automatic corrections have already been committed, pushed and
      # deployed by now, so a failure here doesn't roll anything back — it
      # exists so residual drift can't end the run green with nothing
      # anywhere reporting that main is inconsistent.
      - name: Fail the run if verification failed
        if: always() && steps.verify-inventory.outcome == 'failure'
        run: |
          echo "::error::Inventory verification failed — main still carries drift this workflow could not reconcile automatically."
          echo "Any automatic corrections were still committed and pushed; this step only stops the run from reporting success."
          echo "Reproduce locally with: npm run test:data-source-inventory-paths"
          exit 1
