name: Workflow Outcome Monitor

# Observes scheduled workflow outcomes from OUTSIDE the workflow being watched.
#
# Why external: every data workflow here has a job-level `timeout-minutes`, and
# a job killed by that timeout terminates its runner — `if: always()` does not
# survive it, so an in-job notifier never runs in the one case it was written
# for. build-hna-data has five cancelled runs, four of them at ~120 minutes
# against a 120-minute ceiling; none produced an alert, and #1556 (fifteen days
# with no completed scheduled run) was found by hand.
#
# SCOPE: observes the workflows enumerated below and opens, comments on and
# closes one tracker issue per workflow, keyed on the [workflow-fail:<id>]
# marker the composite action has used since 2026-05 — so it adopts the eight
# trackers that already exist rather than starting a parallel history.
#
# Exactly one alerting path per workflow. `.github/actions/notify-workflow-outcome`
# now runs only in ci-checks.yml, which is deliberately NOT in the list below;
# adding it there without removing that step would alert twice for one failure.
# test/workflow-outcome-monitor.test.js enforces that disjointness.
#
# A cancelled run is still classified `stopped` and alerts on nothing: telling a
# real timeout from a human cancellation needs the job's declared
# timeout-minutes and step count (P2). Guessing would have raised a false
# timeout alert on weekly_housing_brief, which sat at 104% of its ceiling having
# executed no steps.
#
# This monitor must never dispatch, re-run or cancel anything.
# run-all-workflows dispatches children with `gh workflow run`, so a monitor
# with dispatch capability would be one edit from a loop.
# test/workflow-outcome-monitor.test.js asserts that capability is absent.

on:
  # Two halves, because they see different failures.
  #
  # workflow_run fires when a run COMPLETES — it is structurally blind to a cron
  # that quietly stops firing, which is exactly #1556 (build-hna-data, fifteen
  # days with no completed scheduled run, found by hand).
  #
  # Staleness detection is not active yet. Do not schedule a green placeholder
  # that looks like it checked anything; workflow_dispatch exposes the explicit
  # not-yet-active status until that package is implemented.

  workflow_run:
    # Enumerated explicitly, never a wildcard, and never this workflow itself —
    # that is what keeps workflow_run from recursing.
    workflows:
      - "Pages Deploy Watchdog"
      - "Build HNA Data Cache"
      - "CAR Data Update"
      - "Cache HUD GIS Overlay Data"
      - "Data Quality Check"
      - "Data Refresh Pipeline"
      - "Fetch CHFA LIHTC Data"
      - "Fetch Census ACS Data"
      - "Fetch County Demographics and Economic Data"
      - "Fetch FRED Data"
      - "Fetch HUD CHAS Affordability Data"
      - "Fetch HUD FMR + Income Limits"
      - "Fetch Kalshi Prediction Market Data"
      - "Run All Data Workflows"
      - "Site-Wide WCAG Contrast Audit"
      - "Weekly Market Data Sync (Bridge + Zillow Research)"
    types: [completed]
    # Production trackers describe the default branch only. QA frequently
    # dispatches these workflows from feature branches; those runs must never
    # open or close a production tracker.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  # Granted in P4, alongside the first workflow this monitor actually alerts
  # for. P1-P3 held no write permission because they opened nothing.
  issues: write

# Serialize per WATCHED WORKFLOW, not per triggering run.
#
# Keyed on workflow_run.id this group was unique to every run, so two failing
# runs of the same workflow produced two concurrent monitor runs: both looked
# up the tracker, both found none, and both opened one. Two trackers for one
# outage — and a noisy alerting path is one somebody mutes, which is how this
# repo got here.
#
# cancel-in-progress stays false on purpose: the second run must still execute,
# because by then it will see the tracker the first opened and comment instead.
concurrency:
  group: workflow-outcome-monitor-${{ github.event.workflow_run.path || github.run_id }}
  cancel-in-progress: false
  # The default queue keeps only one pending run and silently displaces the
  # previous pending event. Every completed outcome must remain observable.
  queue: max

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout monitor script
        uses: actions/checkout@v7

      - name: Report that staleness alerting is not yet active
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MONITOR_MODE: staleness
        run: node scripts/monitoring/workflow-outcome-monitor.mjs

      # Only scheduled and dispatched runs are alerted on. contrast-audit also
      # runs on every push, and a tracker opened per failing push is noise that
      # gets the whole monitor muted. Any future push-triggered workflow added
      # to the list above inherits this protection.
      - name: Observe and classify the triggering run
        if: >-
          github.event_name == 'workflow_run' &&
          (github.event.workflow_run.event == 'schedule' ||
           github.event.workflow_run.event == 'workflow_dispatch')
        env:
          # Passed explicitly. alert.js relied on GITHUB_TOKEN being present in
          # the environment and it never was, because actions/github-script
          # exposes a token on its client object rather than exporting one.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MONITOR_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          MONITOR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # The marker is built from the workflow FILE's basename, not its display
          # name: existing trackers read [workflow-fail:build-hna-data] while the
          # display name is "Build HNA Data Cache". Without the path the monitor
          # declines to open anything rather than guess an id that would not match
          # the trackers already in this repo.
          MONITOR_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          MONITOR_RUN_URL: ${{ github.event.workflow_run.html_url }}
          MONITOR_RUN_ID: ${{ github.event.workflow_run.id }}
          MONITOR_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          MONITOR_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          MONITOR_RUN_EVENT: ${{ github.event.workflow_run.event }}
          MONITOR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          MONITOR_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/monitoring/workflow-outcome-monitor.mjs
