name: Fetch DOLA Town Household Population

# Monthly: the State Demography Office's household population for every
# incorporated Colorado town (data/market/dola_muni_household_population.json),
# the demand signal behind the town-level calls in market-direction.json.
# DOLA publishes one vintage a year, usually in the autumn; on any other month
# the fetch writes the same bytes and nothing is committed.
#
# Schedule: the 4th of each month at 05:03 UTC. GitHub starts crons ~3 hours
# late (AGENTS.md), so it lands near 08:00 UTC = 01:00-02:00 Mountain, inside
# the 00:00-05:00 window. Minute 03 is used by no other workflow.
on:
  schedule:
    - cron: '3 5 4 * *'   # 4th of each month, 05:03 UTC
  workflow_dispatch:

permissions:
  actions: write   # dispatch deploy.yml after the data push
  contents: write
  issues: write    # failure issue

concurrency:
  group: data-commits
  cancel-in-progress: false
  # Hold every waiting run. Without this GitHub keeps one pending run per
  # group and silently cancels the others (10 dropped data runs, Aug-Oct 2026).
  queue: max

jobs:
  fetch-towns:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Exits 1 without writing when the lookup fails or returns fewer towns
      # than geo-config lists, so a failure leaves the committed file as it was.
      - name: Fetch DOLA town household population
        run: python3 scripts/market/fetch_dola_muni_households.py

      - name: Validate output
        run: node scripts/validate-schemas.js

      # The file feeds data/market/market-direction.json, an output of the
      # derived chain, so the commit goes through
      # scripts/commit-with-derived-chain.sh: the chain is rebuilt and committed
      # with it, or nothing is committed (AGENTS.md).
      - name: Rebuild derived data and commit
        id: commit
        # a dispatch on a branch commits to that branch, never to main
        env:
          DERIVED_COMMIT_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit-with-derived-chain.sh "chore: update DOLA town household population [$(date -u '+%Y-%m-%d')]" -- \
            data/market/dola_muni_household_population.json

      - name: Dispatch Pages deploy for this run's commit
        if: steps.commit.outputs.pushed == 'true'
        # A workflow-token push does not trigger deploy.yml (#1875).
        uses: ./.github/actions/dispatch-pages-deploy

  notify-failure:
    name: Notify on refresh failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [fetch-towns]
    if: failure()

    steps:
      - name: Open GitHub issue on refresh failure
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'dola-towns-refresh-failure';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (existing.data.length > 0) {
              console.log('Refresh failure issue already open — skipping duplicate creation.');
              return;
            }
            const body = [
              `The **Fetch DOLA Town Household Population** workflow failed on run [#${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              '',
              'The committed file was kept: the script writes nothing on failure.',
              '',
              '### Common causes',
              '- the DOLA lookup at gis.dola.colorado.gov is down or changed its parameters',
              '- DOLA returned fewer towns than data/hna/geo-config.json lists',
              '- `validate-schemas.js` rejected the output',
              '',
              '### Recovery steps',
              '1. Read the failing step log',
              '2. Fix the parameters, or re-run once the lookup recovers',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[DOLA Towns] Monthly refresh failed — run #${context.runId}`,
              body,
              labels: [label],
            });
