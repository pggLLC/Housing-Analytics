name: Weekly source liveness

on:
  schedule:
    - cron: "31 14 * * 0"   # Sundays 14:31 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write         # dispatch ci-checks.yml on the PR branch (see the last step)

jobs:
  source-liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # One name for the branch the PR step pushes and the ref ci-checks runs on.
      PR_BRANCH: chore/source-liveness-weekly
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # For scripts/validate-schemas.js in the rebuild step below. It uses only
      # Node builtins, so no npm install is needed — but the version is pinned
      # rather than inherited from the runner image, matching the other
      # manifest-rebuilding workflows.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check jurisdiction brief source liveness
        run: python3 scripts/check-source-liveness.py

      - name: Check pipeline data-source health
        run: python3 scripts/check-data-source-health.py --fail-on-error

      - name: Validate jurisdiction briefs
        run: python3 scripts/validate-jurisdiction-briefs.py

      # The three files above are manifest-tracked, so writing them without
      # rebuilding data/manifest.json leaves its byte counts stale and
      # ci-checks fails on the resulting PR — AGENTS.md hard constraint 3.
      # This step was missing entirely, so every weekly run opened a PR that
      # could not merge (#1548). Schema validation runs alongside it for the
      # same reason the constraint pairs them.
      - name: Rebuild manifest + validate schemas
        run: |
          python3 scripts/rebuild_manifest.py
          node scripts/validate-schemas.js

      - name: Open source-liveness snapshot PR
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(data): weekly source-health snapshot"
          title: "chore(data): weekly source-health snapshot"
          body: "Automated weekly source-liveness and pipeline data-source health snapshot."
          branch: ${{ env.PR_BRANCH }}
          labels: briefs,liveness,data-quality
          add-paths: |
            data/jurisdiction-briefs/_liveness.json
            data/reports/data-source-health.json
            data/source-registry.json
            data/manifest.json

      # Run ci-checks on the pushed head so the PR carries a real result. A PR
      # or push made with GITHUB_TOKEN starts no push workflow, and its
      # pull_request run is held at "action_required" until someone approves
      # it -- on the PR that reads as "only CodeQL ran" (#1995). A
      # workflow_dispatch is the exception GitHub makes for GITHUB_TOKEN, and
      # the dispatched run reports its check on the branch head, which is the
      # PR head. The action waits until the branch reports the SHA the PR
      # step pushed, so it never verifies the previous tip, and fails the step
      # if it does not catch up. Needs `actions: write` (above). Skipped when
      # the action made no commit.
      - name: Dispatch ci-checks on the PR branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        uses: ./.github/actions/dispatch-ci-checks
        with:
          ref: ${{ env.PR_BRANCH }}
          sha: ${{ steps.cpr.outputs.pull-request-head-sha }}
