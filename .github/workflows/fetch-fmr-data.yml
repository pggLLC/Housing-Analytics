name: Fetch HUD FMR + Income Limits

# Downloads HUD Fair Market Rents + Income Limits for Colorado via
# the official HUD User API and writes:
#   data/market/fmr_co.json              — raw FMR API response
#   data/hud-fmr-income-limits.json      — combined FMR + IL by county
#   data/market/fmr_tract_map_co.json    — tract → FMR area cross-reference
#   data/market/hud_zip_tract_crosswalk_co.json — HUD-USPS ZIP→tract CO subset
#
# Requires the HUD_API_TOKEN repository secret. HUD locked the FMR API
# behind Bearer-token auth in 2025-Q4. Register a free token at:
#   https://www.huduser.gov/portal/dataset/fmr-api.html

on:
  schedule:
    # Monthly on the 5th at 04:29 UTC. HUD publishes FMR annually around
    # April 1; running monthly catches the FY rollover within ~30 days
    # without re-fetching unchanged data weekly. The script writes the
    # same output bytes when HUD has nothing new (idempotent), so the
    # commit step short-circuits via `git diff --cached --quiet`.
    - cron: '29 4 5 * *'   # 5th of each month, 04:29 UTC
  workflow_dispatch:
    inputs:
      fetch_fmr:
        description: 'Fetch HUD FMR + Income Limits'
        required: false
        default: 'true'
      fetch_usps_crosswalk:
        description: 'Fetch the HUD-USPS ZIP→tract Colorado subset'
        required: false
        default: 'true'

permissions:
  actions: write   # dispatch deploy.yml after the data push
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false
  # Hold every waiting run. Without this GitHub keeps one pending run per
  # group and silently cancels the others (10 dropped data runs, Aug-Oct 2026).
  queue: max

jobs:
  fetch-fmr:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # paper:build in the derived chain measures repo history
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Fetch and process HUD FMR data
        if: github.event_name == 'schedule' || github.event.inputs.fetch_fmr != 'false'
        env:
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: |
          if [ -z "$HUD_API_TOKEN" ]; then
            echo "::error::HUD_API_TOKEN secret is not set. Register at https://www.huduser.gov/portal/dataset/fmr-api.html and add the token under Settings → Secrets → Actions."
            exit 1
          fi
          python3 scripts/fetch_fmr_api.py

      - name: Fetch HUD-USPS ZIP-to-tract crosswalk
        if: github.event_name == 'schedule' || github.event.inputs.fetch_usps_crosswalk != 'false'
        env:
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: |
          if [ -z "$HUD_API_TOKEN" ]; then
            echo "::error::HUD_API_TOKEN secret is not set. The USPS crosswalk API requires the same HUD User token as FMR."
            exit 1
          fi
          python3 scripts/market/fetch_hud_zip_tract_crosswalk.py

      - name: Validate output files
        if: github.event_name == 'schedule' || github.event.inputs.fetch_fmr != 'false'
        run: |
          echo "── Validating output files ──"
          for f in data/market/fmr_co.json data/hud-fmr-income-limits.json data/market/fmr_tract_map_co.json; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing output file: $f"
              exit 1
            fi
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "  $f: ${size} bytes"
            python3 -c "import json; d=json.load(open('$f')); print('  JSON valid'); print('  meta.generated:', d.get('meta',{}).get('generated','missing'))" \
              || { echo "::error::$f is not valid JSON"; exit 1; }
          done
          # Verify FIPS codes are 5-digit (Rule 1 from project conventions)
          python3 << 'PYEOF'
          import json, sys
          d = json.load(open('data/hud-fmr-income-limits.json'))
          counties = d.get('counties', {})
          # counties may be dict-keyed-by-fips OR list-of-records
          if isinstance(counties, list):
              fips_list = [r.get('fips','') for r in counties]
          else:
              fips_list = list(counties.keys())
          bad = [f for f in fips_list if len(str(f)) != 5]
          if bad:
              print(f"::error::Non 5-digit county FIPS found: {bad[:5]}", file=sys.stderr)
              sys.exit(1)
          print(f"  FIPS validation passed ({len(fips_list)} counties)")

          records = counties if isinstance(counties, list) else list(counties.values())
          amis = [int((row.get('income_limits') or {}).get('ami_4person') or 0) for row in records]
          distinct = {value for value in amis if value > 0}
          statewide_default_count = sum(value == 107200 for value in amis)
          if len(amis) != 64 or len(distinct) < 10:
              print(
                  f"::error::Income Limits are not complete and varied: "
                  f"{len(distinct)} distinct AMIs across {len(amis)} counties",
                  file=sys.stderr,
              )
              sys.exit(1)
          if statewide_default_count > 5:
              print(
                  f"::error::Income Limits are flattened: {statewide_default_count} counties "
                  "use the statewide fallback AMI",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"  Income Limits validation passed ({len(distinct)} distinct county AMIs)")
          PYEOF
          # Verify fmr_co.json has non-zero records
          python3 << 'PYEOF'
          import json, sys
          d = json.load(open('data/market/fmr_co.json'))
          data = d.get('data', {})
          # FMR API response: data['data'] is dict-or-list; presence of
          # any county/area record counts as non-empty.
          if isinstance(data, dict):
              count = sum(1 for _ in data.values() if _)
          elif isinstance(data, list):
              count = len(data)
          else:
              count = 0
          print(f"  fmr_co.json record indicator: {count}")
          if count == 0:
              print("::error::fmr_co.json has 0 records — FMR fetch likely failed", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Validate HUD-USPS crosswalk output
        if: github.event_name == 'schedule' || github.event.inputs.fetch_usps_crosswalk != 'false'
        run: npm run test:hud-zip-tract-crosswalk

      # The scripts/monitoring/alert.js step was removed when this workflow moved to
      # the external monitor (.github/workflows/workflow-outcome-monitor.yml).
      #
      # It never produced anything. alert.js opens an issue only when GITHUB_TOKEN is
      # in the environment, and actions/github-script exposes a token on its client
      # object rather than exporting one -- so `{ ...process.env }` inherited an
      # environment that never had it. Zero issues in this repository's history match
      # alert.js's title formats, across fifteen callers.
      # A new fiscal year (FY2027 from 2026-10-01) changes the vintage every
      # page and export names; rewrite those labels to match the data.
      - name: Sync HUD vintage labels to the fetched data
        run: node scripts/sync-hud-vintage-labels.mjs

      # fmr_co.json feeds data/market/market-direction.json (the rent edge), an
      # input of the derived chain, so the commit goes through
      # scripts/commit-with-derived-chain.sh: the chain is rebuilt and committed
      # with the HUD files, or nothing is committed (AGENTS.md).
      - name: Rebuild derived data and commit the HUD refresh
        id: commit
        run: |
          LABEL_FILES=$(node --input-type=module -e "import('./scripts/sync-hud-vintage-labels.mjs').then(m => console.log([...new Set(m.RULES.flatMap(r => r.files))].join(' ')))")
          scripts/commit-with-derived-chain.sh "chore: update HUD data artifacts [$(date -u '+%Y-%m-%d')]" -- \
            data/market/fmr_co.json data/hud-fmr-income-limits.json data/market/fmr_tract_map_co.json \
            data/market/hud_zip_tract_crosswalk_co.json $LABEL_FILES
      - name: Dispatch Pages deploy for this run's commit
        if: steps.commit.outputs.pushed == 'true'
        # A workflow-token push does not trigger deploy.yml (#1875).
        uses: ./.github/actions/dispatch-pages-deploy
