name: Refresh State Trend Analysis (annual)

# Pulls 12 states × 4 housing metrics (2019-2024) from FRED for the
# peer-state comparison on colorado-deep-dive.html. The keyless CSV
# endpoint throttles too hard for 48 calls in a single window, so this
# job uses the FRED API endpoint via the FRED_API_KEY repo secret.
#
# Cron: runs Q1 each year, after FRED publishes annual revisions. Can
# also be triggered manually via workflow_dispatch.

on:
  schedule:
    - cron: '23 8 5 2 *'   # 08:23 UTC on 5 February (annual)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write         # dispatch ci-checks.yml on the PR branch (see the last step)

concurrency:
  group: state-trend-analysis
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # One name for the branch the PR step pushes and the ref ci-checks runs on.
      PR_BRANCH: chore/state-trend-refresh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run fetcher
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::warning::FRED_API_KEY not set — falling back to keyless CSV path (~5 min, may throttle)"
          fi
          python3 -u scripts/fetch_state_trend_analysis.py

      - name: Show diff stat
        run: |
          if git diff --stat data/market/state-trend-analysis.json | grep -q "state-trend-analysis"; then
            echo "Changes detected — opening PR"
            echo "HAS_CHANGES=1" >> $GITHUB_ENV
          else
            echo "No data changes — exiting cleanly"
          fi

      - name: Open PR
        if: env.HAS_CHANGES == '1'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(trend): refresh state-trend-analysis from FRED"
          title: "chore(trend): refresh state-trend-analysis from FRED"
          branch: ${{ env.PR_BRANCH }}
          body: |
            Annual refresh of the peer-state housing trend data on
            colorado-deep-dive.html. Fetched 12 states × 4 metrics ×
            6 years (2019-2024) from FRED via scripts/fetch_state_trend_analysis.py.

            Series sourced:
            • MEDLISPRI{state}  (Realtor.com median listing price)
            • {state}STHPI      (FHFA House Price Index, Q4-over-Q4)
            • ACTLISCOU{state}  (Realtor.com active listing count)
            • {state}BPPRIV     (Census Building Permits Survey)

            Review the diff for sanity (no implausible YoY moves, no
            null arrays per state) before merging.
          delete-branch: true

      # Run ci-checks on the pushed head so the PR carries a real result. A PR
      # or push made with GITHUB_TOKEN starts no push workflow, and its
      # pull_request run is held at "action_required" until someone approves
      # it -- on the PR that reads as "only CodeQL ran" (#1995). A
      # workflow_dispatch is the exception GitHub makes for GITHUB_TOKEN, and
      # the dispatched run reports its check on the branch head, which is the
      # PR head. The action waits until the branch reports the SHA the PR
      # step pushed, so it never verifies the previous tip, and fails the step
      # if it does not catch up. Needs `actions: write` (above). Skipped when
      # the action made no commit.
      - name: Dispatch ci-checks on the PR branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        uses: ./.github/actions/dispatch-ci-checks
        with:
          ref: ${{ env.PR_BRANCH }}
          sha: ${{ steps.cpr.outputs.pull-request-head-sha }}
