name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    # F171 — DO NOT add paths-ignore for data/**. Backfill workflows (e.g.
    # backfill-hna-household-occupation.yml) commit data-only changes that
    # MUST trigger a redeploy or the public site stays on stale JSON until
    # the next code push. The earlier paths-ignore: data/** caused users to
    # see "—" for stats whose values were freshly backfilled but never
    # made it to Pages.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Generates the PUBLIC client config. Anything written here is served to
      # every visitor at the site path /js/config.js, so no secret
      # may appear in it.
      #
      # This step used to interpolate secrets.CENSUS_API_KEY and
      # secrets.FRED_API_KEY, publishing both from 2026-02-26 until #1668 on
      # 2026-09-14. Removing them was right and must not be undone: whatever
      # this step writes is served to every visitor, so a browser key is a
      # published key.
      #   - FRED cannot be called from a browser at all (CORS); FRED data is
      #     served from data/fred-data.json, built server-side.
      #   - Census: #1668 recorded that "Census answers every endpoint this
      #     site calls WITHOUT a key". That is NO LONGER TRUE, and the site
      #     must not rely on it. Measured 2026-09-19: a keyless acs5 request
      #     returns 302 -> missing_key.html with X-DataWebAPI-KeyError: 1 and
      #     no Access-Control-Allow-Origin, so the browser reports a CORS
      #     failure. The fix is NOT to publish the key again — it is that the
      #     browser does not need Census at all. Every figure a visitor sees
      #     comes from the 547 cached summaries in data/hna/summary/ and the
      #     other generated JSON; js/hna/hna-controller.js now skips the live
      #     call outright when no key is configured (test:keyless-census).
      # The ~16 workflows that legitimately use those secrets are unaffected —
      # they run on the runner, and they are what builds those caches.
      #
      # Developers who want a key locally can still supply one: js/config.js
      # reads a localStorage override (coho_api_*), set via the Data Quality
      # Dashboard and stored only in that browser.
      - name: Generate js/config.js (public — no secrets)
        run: |
          DATA_VERSION="$(date -u +%Y-%m-%d)"
          cat > js/config.js << EOF
          window.APP_CONFIG = window.APP_CONFIG || {};
          var _defaults = {
            DATA_VERSION:   "${DATA_VERSION}"
          };
          Object.keys(_defaults).forEach(function (k) {
            if (!Object.prototype.hasOwnProperty.call(window.APP_CONFIG, k)) {
              window.APP_CONFIG[k] = _defaults[k];
            }
          });
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run deploy preflight checks
        run: node scripts/deploy-preflight.js

      - name: Refresh CHFA LIHTC data
        run: node scripts/fetch-chfa-lihtc.js
        continue-on-error: true

      - name: Run pages availability checks
        run: node test/pages-availability-check.js

      - name: Build public site artifact
        run: node scripts/build-public-site.mjs

      - name: Guard public site artifact
        run: node scripts/audit/public-artifact-guard.mjs dist

      - name: Setup Pages
        # actions/configure-pages@v6 SHA (45bfe019…) was unreachable via
        # codeload CDN on 2026-05-26 — fresh major-version tag CDN-propagation
        # hiccup. Holding at @v5 (known-good). Revisit when codeload catches up.
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
