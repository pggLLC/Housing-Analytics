name: Fetch County Demographics and Economic Data

# Refreshes county-level ACS demographic fallback data weekly so the
# market-intelligence page always has a local JSON file to fall back to
# when the Census API is slow or unavailable.
# Also refreshes the Economic Health KPIs (co-county-economic-indicators.json)
# using BLS LAUS, BLS QCEW, and ACS 5-year data.
#
# Schedule: every Saturday at 06:41 UTC
# Manual: workflow_dispatch

on:
  schedule:
    - cron: '41 6 * * 6'   # Saturdays 06:41 UTC
  workflow_dispatch:        # Allow manual triggering from the Actions tab

permissions:
  contents: write
  actions: write   # gh workflow run deploy.yml

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  fetch-county-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install --omit=dev node-fetch@2

      - name: Fetch ACS county demographics
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}   # keyless Census requests 302 — without this the fetch is a no-op
        run: node scripts/fetch-county-demographics.js
        continue-on-error: true   # Non-fatal: retain existing file if Census API is down

      - name: Validate demographics output
        run: |
          if ! jq -e '.counties | type == "object"' data/co-county-demographics.json > /dev/null; then
            echo "❌ co-county-demographics.json invalid — skipping commit"
            exit 1
          fi
          echo "✅ co-county-demographics.json is valid"
          echo "   Counties: $(jq '.counties | keys | length' data/co-county-demographics.json)"
          # Shape alone cannot tell a fresh file from one the fetch never touched:
          # this step passed weekly for months while the keyless fetch 302'd and
          # the script exited 0. Say so out loud when nothing moved.
          if git diff --quiet -- data/co-county-demographics.json; then
            echo "::warning::Census fetch produced no change to co-county-demographics.json — if this repeats weekly the refresh is a no-op, not a stable dataset."
          fi
        continue-on-error: true

      - name: Fetch county economic indicators (BLS LAUS + QCEW + ACS)
        env:
          BLS_API_KEY:    ${{ secrets.BLS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python3 scripts/fetch_county_economic_indicators.py
        continue-on-error: true   # Non-fatal: retain existing file if APIs are down

      - name: Validate economic indicators output
        run: |
          if jq -e '.counties | type == "object"' data/co-county-economic-indicators.json > /dev/null; then
            echo "✅ co-county-economic-indicators.json is valid"
            echo "   Counties: $(jq '.counties | keys | length' data/co-county-economic-indicators.json)"
            echo "   Updated:  $(jq -r '.updated' data/co-county-economic-indicators.json)"
          else
            echo "❌ co-county-economic-indicators.json invalid"
            exit 1
          fi
        continue-on-error: true

      # The scripts/monitoring/alert.js step was removed when this workflow moved to
      # the external monitor (.github/workflows/workflow-outcome-monitor.yml).
      #
      # It never produced anything. alert.js opens an issue only when GITHUB_TOKEN is
      # in the environment, and actions/github-script exposes a token on its client
      # object rather than exporting one -- so `{ ...process.env }` inherited an
      # environment that never had it. Zero issues in this repository's history match
      # alert.js's title formats, across fifteen callers.
      - name: Commit and push updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/rebuild_manifest.py
          git add data/co-county-demographics.json data/co-county-economic-indicators.json data/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to county data files"
          else
            git commit -m "chore: refresh county demographics and economic indicators [$(date -u '+%Y-%m-%d')]"
            git pull --rebase --autostash -X theirs origin main
            python3 scripts/rebuild_manifest.py
            if ! git diff --quiet -- data/; then
              git add data/
              git commit --amend --no-edit
            fi
            git push
          fi

      - name: Dispatch Pages deploy for the data commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Workflow-token pushes do not trigger deploy.yml. Verified: the
          # refresh commit 5a36e81ab got zero deploy runs and its data never
          # reached the site until a later commit happened to carry it.
          if git diff --quiet HEAD~1 -- data/ 2>/dev/null; then
            echo "No data change in the last commit — nothing to deploy."
          else
            gh workflow run deploy.yml --ref main
            echo "Dispatched deploy.yml for the refreshed data."
          fi
