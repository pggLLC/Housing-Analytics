name: Upstream Vintage Watch

# Weekly check for new vintage releases from external data publishers
# (HUD CHAS, HUD FMR, Census ACS 5-year) and new CHFA tax credit rounds. Outdated or unverifiable sources
# open/update one tracking issue; blocked CHAS checks also emit a warning.
#
# Refreshes data/audit/upstream-vintage-watch.json on every run for the
# QA dashboard to display.

on:
  schedule:
    - cron: '29 5 * * 5'   # Fridays 05:29 UTC
  workflow_dispatch:

permissions:
  actions: write   # dispatch deploy.yml after the data push
  contents: write
  issues: write

concurrency:
  group: upstream-vintage-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run vintage watcher
        id: watch
        run: |
          node scripts/audit/upstream-vintage-watch.mjs

      - name: Open / update tracking issue for outdated or unverifiable sources
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const status = JSON.parse(
              fs.readFileSync('data/audit/upstream-vintage-watch.json', 'utf8')
            );
            const attention = (status.sources || []).filter(s => s.is_outdated || s.status === 'unverifiable' || s.error);
            for (const source of attention) {
              if (source.status === 'unverifiable' || source.error) {
                core.warning(`${source.source}: ${source.notes || source.error}`);
              }
            }
            const ISSUE_MARKER = '<!-- upstream-vintage-watch-tracker -->';

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(i =>
              !i.pull_request && i.body && i.body.includes(ISSUE_MARKER)
            );

            if (attention.length === 0) {
              // Close only after every source can be checked and none needs an update.
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `All upstream sources are within their refresh window as of ${status.generated_at}. Closing tracker.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }

            const rows = attention.map(s =>
              `| ${s.source} | ${s.current_vintage || '?'} | ${s.latest_vintage || 'not verified'} | ${s.status || (s.error ? 'unverifiable' : 'outdated')} | ${s.notes || s.error || ''} |`
            ).join('\n');
            const title = `Upstream vintage check needs attention — ${attention.length} source(s)`;
            const body = [
              ISSUE_MARKER,
              '',
              '# Upstream vintage checks need attention',
              '',
              `Detected at ${status.generated_at} by \`scripts/audit/upstream-vintage-watch.mjs\`.`,
              '',
              '| Source | Current vintage | Latest vintage | Status | Notes |',
              '| --- | --- | --- | --- | --- |',
              rows,
              '',
              '## Next steps',
              '',
              '- Review whether the new vintage is materially different from the current one (some annual updates are minor)',
              '- For each outdated source, run the corresponding fetch script to upgrade:',
              '    - HUD CHAS: a blocked check needs a manual vintage check at https://www.huduser.gov/portal/datasets/cp.html. It does not establish whether a new release exists.',
              '      Follow [the manual refresh runbook](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/blob/main/docs/runbooks/chas-manual-refresh.md) only if the published vintage changed.',
              '    - HUD FMR:  `python3 scripts/fetch_fmr_api.py`',
              '    - ACS:      bump `DEFAULT_VINTAGE` in `scripts/hna/build_place_ami_gap.py`',
              '    - CHFA round: parse the award-description page into `data/affordable-housing/chfa-awards/<year>-round-<one|two>.json` (same shape as `2026-round-one.json`, with `county` / `county_fips`) until CHFA\'s property feed carries it',
              '- Run plausibility tests + spot-check key counties before merging',
              '',
              `<sub>This issue is auto-managed by [upstream-vintage-watch.yml](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.github/workflows/upstream-vintage-watch.yml). It will be auto-closed when all checks are verifiable and no source needs an update.</sub>`,
            ].join('\n');

            // The status rows of a tracker body, without the run timestamp.
            const statusRows = (text) => (String(text || '').match(/^\| (?!Source \||--- \|).*$/gm) || []).join('\n');
            if (existing) {
              // HUD blocks automated requests indefinitely, so this tracker can
              // stay open for months. Refresh the body every run, but comment
              // (and notify) only when the status itself changed.
              const changed = statusRows(existing.body) !== rows;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              if (changed) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Status changed at ${status.generated_at}.`,
                });
              }
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              // Labels go on after the issue exists, so a missing label can
              // never stop the tracker from being opened. Neither label
              // existed in the repo when this was written (#2063).
              const labels = ['data-pipeline', 'upstream-vintage'];
              for (const name of labels) {
                try {
                  await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color: 'ededed' });
                } catch (error) {
                  if (error.status !== 422) core.warning(`Could not create label ${name}: ${error.message}`);
                }
              }
              try {
                await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: created.number, labels });
              } catch (error) {
                core.warning(`Tracker #${created.number} opened without labels: ${error.message}`);
              }
            }

      - name: Commit refreshed watch result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/rebuild_manifest.py
          git add data/audit/upstream-vintage-watch.json data/manifest.json
          git diff --cached --quiet || git commit -m "chore: refresh upstream-vintage-watch $(date -u +'%Y-%m-%d')"
          # F119 — was `git merge --strategy=ours origin/main || true` which
          # discards every change from origin/main and (with `|| true`) swallows
          # the failure silently. That pattern wiped F119 on 2026-06-05 via the
          # sibling build-hna-data workflow. This workflow runs DAILY at 12:15
          # UTC, so the race window against human commits is largest — the
          # silent-clobber risk was material. Now: rebase the vintage-watch
          # commit on top of current main so the rest of the tree is preserved.
          # Drop `|| true` so a real conflict surfaces in the job log.
          git fetch origin main
          # F122 — --autostash; see build-hna-data.yml for full rationale.
          git rebase --autostash origin/main
          git push
      - name: Dispatch Pages deploy for this run's commit
        # A workflow-token push does not trigger deploy.yml (#1875).
        uses: ./.github/actions/dispatch-pages-deploy
