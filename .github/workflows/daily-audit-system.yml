name: Daily Audit System

on:
  schedule:
    - cron: '13 9 * * *'   # daily 09:13 UTC
  workflow_dispatch:        # Allow manual triggering

jobs:
  audit:
    name: Full Diagnostic Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # ── Setup ───────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install audit dependencies
        run: npm ci --ignore-scripts

      # ── Unit & Smoke Tests ───────────────────────────────────────────────────
      - name: Run unit tests
        run: node test/website-monitor.test.js
        continue-on-error: true

      # ── Audit history ────────────────────────────────────────────────────────
      # monitoring-reports/ is gitignored, so a fresh runner starts with no
      # prior snapshot. loadPriorSnapshot() then returns null and every finding
      # is classified "new" -- the daily email has been reporting the same 51
      # issues as 51 NEW issues every morning, and nothing has ever been able to
      # show as Resolved or Persistent. Carrying the history dir across runs is
      # the whole fix; the comparison logic itself is correct.
      #
      # The key is unique per run so the save always succeeds, and restore-keys
      # prefix-matches the most recent previous run. The cache is read and
      # written daily, so it stays well inside the 7-day eviction window.
      - name: Restore prior audit history
        uses: actions/cache/restore@v6
        with:
          path: monitoring-reports/audit-history
          key: audit-history-${{ github.run_id }}
          restore-keys: |
            audit-history-

      # ── Full Daily Audit ─────────────────────────────────────────────────────
      - name: Run Daily Audit System
        env:
          WEBSITE_URL:       ${{ secrets.WEBSITE_URL }}
          RECIPIENT_EMAIL:   ${{ secrets.RECIPIENT_EMAIL }}
          EMAIL_USER:        ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node test/daily-audit-system.js
        continue-on-error: true

      # Saved immediately after the audit, and with if: always(), so a failure
      # in one of the legacy checks below cannot cost us the day's snapshot.
      - name: Save audit history
        if: always()
        uses: actions/cache/save@v6
        with:
          path: monitoring-reports/audit-history
          key: audit-history-${{ github.run_id }}

      # ── Legacy Checks (kept for compatibility) ───────────────────────────────
      - name: Verify script loads
        run: node test/verify-script-loads.js
        continue-on-error: true

      - name: Test fallback mechanisms
        run: node test/test-fallback-mechanisms.js
        continue-on-error: true

      - name: Run Lighthouse audit
        run: node test/lighthouse-audit.js
        continue-on-error: true

      # ── Artifacts ────────────────────────────────────────────────────────────
      - name: Upload audit reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-reports-${{ github.run_number }}
          path: |
            monitoring-reports/
          retention-days: 90
