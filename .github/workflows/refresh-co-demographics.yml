name: Refresh Colorado demographics

# data/co-demographics.json is the only source behind market-intelligence.html.
# It had no generator and no workflow: hand-maintained, stuck on ACS 2019-2023
# while the rest of the site moved to 2020-2024.
#
# This job does NOT use continue-on-error. The neighbouring county refresh does,
# and combined with a script that exits 0 on failure it reported success weekly
# for months while changing nothing. A refresh that cannot refresh should go red.

on:
  schedule:
    - cron: '17 7 15 * *'      # monthly, 15th at 07:17 UTC — ACS 5-year is annual
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # gh workflow run deploy.yml

concurrency:
  group: refresh-co-demographics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build co-demographics.json from the ACS
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python3 scripts/build_co_demographics.py

      - name: Confirm the file is the vintage the script builds
        run: python3 scripts/build_co_demographics.py --check

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/co-demographics.json data/manifest.json; then
            echo "No change — ACS values identical to the committed file."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The manifest byte count moves with the file. The first run left it
          # behind and main went red-but-unreported: a bot push gets no
          # pull_request workflows, so it ran CodeQL and nothing else.
          git add data/co-demographics.json data/manifest.json
          git commit -m "chore(data): refresh Colorado demographics from the ACS"

          # main is busy: the post-merge automation bot pushed twice within
          # seconds of the last merge and this job's push was rejected as
          # non-fast-forward. Rebase and retry rather than failing a refresh
          # that actually worked. --rebase keeps our single data commit on top
          # of whatever landed; there is nothing to merge because no other job
          # writes these two files.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || {
              echo "::error::rebase failed — refusing to force a data commit onto main"
              exit 1
            }
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 5 attempts; main is moving faster than this job"
          exit 1

      - name: Dispatch Pages deploy for the data commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A commit pushed with the workflow token does not trigger
          # push-based workflows, so deploy.yml never fires for it. Verified:
          # the data-only refresh commits 8d5026b4c, 81a15546f and 5a36e81ab
          # each got ZERO deploy runs, and the refreshed JSON sat on main
          # without reaching the site. Same pattern, same fix, as
          # archive-audit-post-merge.yml.
          if git diff --quiet HEAD~1 -- data/co-demographics.json 2>/dev/null; then
            echo "No data change in the last commit — nothing to deploy."
          else
            gh workflow run deploy.yml --ref main
            echo "Dispatched deploy.yml for the refreshed data."
          fi
