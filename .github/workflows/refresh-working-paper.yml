name: Refresh Working Paper Figures

# The working paper's figures about Colorado are gated per-PR by
# test:paper-fresh, so they cannot drift. Its figures about the repository's own
# git history — commit counts, the monthly chart, the first and last commit —
# change on every push, and gating those would fail every pull request in a repo
# that takes thirty commits a day. A gate nobody can leave on protects nothing.
#
# So those figures are declared `volatile` by the generator, excluded from the
# per-PR check, and refreshed here instead. Weekly is enough: the chart is
# monthly, and a week-old commit count is not a claim about housing.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to dispatch deploy.yml — a workflow-token push does not

concurrency:
  group: refresh-working-paper
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The generator counts commits. A shallow clone would count the
          # fetch depth instead and publish it as the project's history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Rebuild figures and inject them
        run: npm run paper:build

      - name: Verify the page still agrees with the data
        # If this fails the refresh is abandoned rather than committed. A
        # scheduled job that pushes an unverified page is how a paper goes
        # quietly wrong between readings.
        run: npm run test:paper-fresh

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- working-paper.html data/paper/figures.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in the paper's figures this week."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add working-paper.html data/paper/figures.json
          git commit -m "chore(paper): refresh working-paper figures $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch the Pages deploy
        # Pushes made with GITHUB_TOKEN trigger no workflows, so deploy.yml
        # never sees this commit unless it is asked explicitly. That gap is
        # issue #1654; every data workflow in this repo now closes it the same
        # way.
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
            core.notice('Dispatched deploy.yml for the refreshed working paper.');
