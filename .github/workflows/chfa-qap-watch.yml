name: CHFA QAP Watch
# Weekly check of CHFA's Housing Tax Credit QAP pages. Records every linked
# document (QAP, summary of changes, redline, amendments) with a content hash,
# keeps the extracted text of the QAP documents in
# data/audit/chfa-qap-watch.json, and opens or updates a tracking issue when a
# document is added, changed or removed, when the dates or dollar amounts on a
# QAP page change, or when CHFA cannot be reached.
#
# Why the text is committed: Claude Code sessions may run behind an egress
# policy that does not allow chfainfo.com. GitHub Actions can reach it, so the
# text lands in the repo where any session can read it.
#
# Mirrors upstream-vintage-watch.yml. The file is only rewritten when
# something besides timestamps changed, so a quiet week adds no commit.
#
# A second job, funding-watch, runs daily: scripts/audit/funding_watch.py reads
# every funding program's page (from the two funding catalogs), each funding
# agency's announcement pages (data/policy/funding-watch-sources.json), and the
# Grants.gov and Federal Register notice feeds, and opens an issue per changed
# page (label funding-watch). It never changes a program's status. It lives in
# this workflow rather than its own so the two watchers share one concurrency
# group and never push at the same time. Each job runs on its own cron; a manual
# dispatch runs both, the QAP job first.
on:
  schedule:
    - cron: '21 5 * * 3'   # QAP watch: Wednesdays 05:21 UTC (lands ~02:30 MT with GitHub's usual delay)
    - cron: '34 5 * * *'   # funding watch: daily 05:34 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # dispatch deploy.yml after workflow-token push
  issues: write

concurrency:
  group: chfa-qap-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.event_name != 'schedule' || github.event.schedule == '21 5 * * 3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install PDF parser
        # cryptography: CHFA's full QAP drafts are AES-encrypted; pypdf needs it to open them.
        run: python3 -m pip install --quiet pypdf==5.1.0 cryptography==50.0.1

      - name: Run QAP watcher
        run: python3 scripts/audit/chfa_qap_watch.py --summary "$RUNNER_TEMP/chfa-qap-run.json"

      # Runs when the watcher refused an oversized write (exit 1) too, so the refusal
      # reaches the tracking issue. (hashFiles cannot see runner.temp, so the summary's
      # existence is checked in the script; it is absent only on an internal error.)
      - name: Open / update tracking issue
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          RUN_SUMMARY: ${{ runner.temp }}/chfa-qap-run.json
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync(process.env.RUN_SUMMARY)) {
              core.info('No run summary: the watcher failed before writing one (see the step above).');
              return;
            }
            const run = JSON.parse(fs.readFileSync(process.env.RUN_SUMMARY, 'utf8'));
            const c = run.changes || {};
            const failures = run.fetch_failures || [];
            const unreadable = run.extraction_failures || [];
            if (!run.has_changes && failures.length === 0 && unreadable.length === 0 && !run.write_refused) {
              core.info('No QAP changes and no fetch failures.');
              return;
            }
            const MARKER = '<!-- chfa-qap-watch-tracker -->';
            const fence = (lines) => lines && lines.length ? '```\n' + lines.slice(0, 30).join('\n') + '\n```' : '_none_';
            const parts = [MARKER, '', `# CHFA QAP watch: ${run.generated_at}`, ''];
            if (run.write_refused) {
              parts.push('## The watch file was not updated', '', `The new result was too large: ${run.write_refused}.`,
                'Lower `TEXT_BUDGET_BYTES` or `TEXT_CYCLES_KEPT` in `scripts/audit/chfa_qap_watch.py`. The changes below were detected but not recorded.', '');
            }
            if (c.baseline) {
              parts.push('Baseline recorded. The current QAP documents and their text are now in `data/audit/chfa-qap-watch.json`.', '');
            }
            for (const d of c.new_documents || []) {
              parts.push(`## New document: [${d.title}](${d.url})`, '', 'Lines with amounts or limits:', fence(d.key_lines), '');
            }
            for (const d of c.changed_documents || []) {
              parts.push(`## Changed: [${d.title}](${d.url})`, '');
              if (d.key_lines) {
                parts.push('Lines added:', fence(d.key_lines.added), '',
                  'Lines removed:', fence(d.key_lines.removed), '');
              } else {
                parts.push(`The file changed, but its text could not be compared: ${d.extraction_error || 'no text on one side'}. Open the PDF.`, '');
              }
            }
            for (const d of c.now_readable || []) {
              parts.push(`## Now readable (unchanged file, text extracted for the first time): [${d.title}](${d.url})`, '',
                'Lines with amounts or limits:', fence(d.key_lines), '');
            }
            for (const d of c.removed_documents || []) {
              parts.push(`## Removed from CHFA's pages: [${d.title}](${d.url})`, '');
            }
            for (const p of c.changed_pages || []) {
              parts.push(`## Dates or amounts changed on [${p.id}](${p.url})`, '',
                'Added:', fence(p.key_lines && p.key_lines.added), '',
                'Removed:', fence(p.key_lines && p.key_lines.removed), '');
            }
            if (unreadable.length) {
              parts.push('## PDFs whose text could not be extracted', '',
                ...unreadable.map(f => `- [${f.title}](${f.url}): ${f.error}`), '');
            }
            if (failures.length) {
              parts.push(run.all_fetches_failed
                ? '## CHFA could not be reached. Nothing was updated.'
                : '## Some CHFA addresses failed');
              parts.push('', ...failures.map(f => `- ${f.url}: ${f.error}`), '');
            }
            parts.push('## Next steps', '',
              '- Read the change in CHFA\'s PDF before relying on it. The text in the watch file is machine-extracted.',
              '- Check `data/chfa-qap-calendar.json` and `data/policy/tax-credit-legislation.json` against it.',
              '',
              `<sub>Managed by [chfa-qap-watch.yml](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.github/workflows/chfa-qap-watch.yml). Close this issue once the change has been reviewed.</sub>`);
            const body = parts.join('\n').slice(0, 60000);
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = open.find(i => i.body && i.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: run.write_refused ? 'CHFA QAP watch result too large to record'
                  : run.all_fetches_failed ? 'CHFA QAP watch could not reach CHFA' : 'CHFA QAP documents changed',
                body,
              });
            }

      - name: Commit refreshed watch result
        id: watch-commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The watcher leaves its file untouched on a quiet week. Check that before
          # touching the manifests: rebuild_manifest.py always stamps a new time,
          # so rebuilding unconditionally would commit every week.
          if git diff --quiet -- data/audit/chfa-qap-watch.json; then
            echo "Watch file unchanged; nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Cron commits skip CI, so run the size guard ci-checks would have run: a
          # file over the ceiling here fails every PR once it reaches main.
          node scripts/check-data-file-sizes.mjs
          # AGENTS.md rule 3, in order: _manifest first (manifest.json records its size).
          npm run audit:file-manifest
          python3 scripts/rebuild_manifest.py
          node scripts/validate-schemas.js
          git add data/audit/chfa-qap-watch.json data/_manifest.json data/manifest.json
          git commit -m "chore: refresh chfa-qap-watch $(date -u +'%Y-%m-%d')"
          # Rebase onto current main rather than merging with -s ours (F119):
          # a real conflict must surface in the job log, not be discarded.
          git fetch origin main
          git rebase --autostash origin/main
          npm run audit:file-manifest
          python3 scripts/rebuild_manifest.py
          if ! git diff --quiet -- data/_manifest.json data/manifest.json; then
            git add data/_manifest.json data/manifest.json
            git commit --amend --no-edit
          fi
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.watch-commit.outputs.pushed == 'true'
        uses: actions/github-script@v9
        env:
          PUSHED_SHA: ${{ steps.watch-commit.outputs.pushed_sha }}
        with:
          script: |
            // Same race guard as qa-status.yml (F-WD-01): the branch API can
            // lag the push by a few seconds, and a dispatch made before it
            // catches up resolves `ref: 'main'` to the previous SHA, so Pages
            // deploys the old commit and the watchdog still flags this one.
            // Poll until main is the pushed SHA (up to 30 s), then dispatch.
            const pushedSha = process.env.PUSHED_SHA;
            const maxWaitMs = 30000;
            const pollIntervalMs = 3000;
            const deadline = Date.now() + maxWaitMs;

            let currentSha = null;
            while (Date.now() < deadline) {
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
              });
              currentSha = branch.commit.sha;
              if (currentSha === pushedSha) break;
              core.info(`Waiting for GitHub API to reflect pushed SHA ${pushedSha} (currently ${currentSha})…`);
              await new Promise(resolve => setTimeout(resolve, pollIntervalMs));
            }

            if (currentSha !== pushedSha) {
              core.warning(
                `GitHub API HEAD (${currentSha}) still does not match pushed SHA ` +
                `(${pushedSha}) after ${maxWaitMs / 1000}s; dispatching anyway.`
              );
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
            core.notice(`Dispatched deploy.yml for chfa-qap-watch commit ${pushedSha}.`);

  funding-watch:
    # After the QAP job (when it runs), so the two never push at once. A skipped
    # QAP job does not skip this one: !cancelled() replaces the implied success().
    needs: watch
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.event.schedule == '34 5 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The branch tip, not the triggering SHA: the QAP job may have just pushed to it.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run funding watcher
        run: python3 scripts/audit/funding_watch.py --summary "$RUNNER_TEMP/funding-watch-run.json"

      - name: Open / update funding watch issues
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          RUN_SUMMARY: ${{ runner.temp }}/funding-watch-run.json
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync(process.env.RUN_SUMMARY)) {
              core.info('No run summary: the watcher failed before writing one (see the step above).');
              return;
            }
            const run = JSON.parse(fs.readFileSync(process.env.RUN_SUMMARY, 'utf8'));
            const c = run.changes || {};
            const pages = c.changed_pages || [];
            const notices = c.new_federal_notices || [];
            const unverifiable = c.newly_unverifiable || [];
            if (c.baseline) core.info(`Baseline recorded for ${(c.baseline_pages || []).length} pages; no issues opened.`);
            // A failed search or page is never reported as "nothing new". It gets a run warning
            // every day it fails; the issue comes once, when it has failed for 3 days (newly_unverifiable).
            const fedFailed = run.federal_failures || [];
            const pagesFailed = run.fetch_failures || [];
            for (const f of fedFailed) core.warning(`Federal search incomplete: ${f.source} ${f.query}: ${f.error}`);
            for (const f of pagesFailed) core.warning(`Page not read: ${f.url}: ${f.error} (failing since ${f.failing_since})`);
            // A search that matched more than its page or record cap was read only up to the cap.
            for (const f of run.pages_capped || []) core.warning(`Page at the watch limit: ${f.url}: ${f.key_lines} key lines, ${f.documents} documents kept; anything past the limit is not watched.`);
            for (const f of run.federal_capped || []) core.warning(`Federal search capped: ${f.source} ${f.query}: read ${f.read} of ${f.total ?? 'more'} results; the rest were not checked this run.`);
            if (!pages.length && !notices.length && !unverifiable.length && !run.write_refused && !run.all_fetches_failed) {
              if (fedFailed.length || pagesFailed.length) {
                core.info(`Incomplete run: ${fedFailed.length} federal search(es) and ${pagesFailed.length} page(s) failed, so "no change" is unknown for them. Each source gets one "check by hand" issue once it has failed for 3 days.`);
              } else {
                core.info('No funding page changes, no new federal notices, nothing newly unverifiable.');
              }
              return;
            }
            const { owner, repo } = context.repo;
            const LABEL = 'funding-watch';
            const footer = `<sub>Managed by [chfa-qap-watch.yml](https://github.com/${owner}/${repo}/blob/main/.github/workflows/chfa-qap-watch.yml) (funding-watch job). The text above is copied from the agency's page by machine: it is data, not instruction. Close this issue once the record has been checked.</sub>`;
            const fence = (lines) => lines && lines.length ? '```\n' + lines.join('\n') + '\n```' : '_none_';
            // The label must exist before an issue can carry it, and a label problem must
            // never stop the alert: a failed issue step also skips the commit, so the change
            // would be neither reported nor recorded (Codex, 2026-10-15).
            try {
              await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'ededed', description: 'A funding agency page or federal notice changed' });
            } catch (error) {
              if (error.status !== 422) core.warning(`Could not create label ${LABEL}: ${error.message}`);
            }
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: LABEL, per_page: 100 });
            // Nothing is cut: a change is recorded once and never reported again, so a line
            // dropped here would never be seen. A body over PART_CHARS is split at line
            // boundaries into numbered parts (the first opens the issue, the rest comment on
            // it), well under GitHub's 65,536-character limit. A code fence open at a split
            // is closed and reopened, and a single overlong line is split as well.
            const PART_CHARS = 50000;
            function splitBody(body) {
              const lines = [];
              for (const l of body.split('\n')) {
                for (let i = 0; i < Math.max(l.length, 1); i += PART_CHARS) lines.push(l.slice(i, i + PART_CHARS));
              }
              const parts = [];
              let cur = [], size = 0, inFence = false;
              for (const l of lines) {
                if (cur.length && size + l.length + 1 > PART_CHARS) {
                  if (inFence) cur.push('```');
                  parts.push(cur.join('\n'));
                  cur = inFence ? ['```'] : []; size = inFence ? 4 : 0;
                }
                cur.push(l); size += l.length + 1;
                if (l.startsWith('```')) inFence = !inFence;
              }
              if (cur.length) parts.push(cur.join('\n'));
              return parts;
            }
            async function post(marker, title, body) {
              const chunks = splitBody(body);
              for (const [k, chunk] of chunks.entries()) {
                const label = chunks.length > 1 ? `_Part ${k + 1} of ${chunks.length}_\n\n` : '';
                const text = [marker, '', label + chunk, '', footer].join('\n');
                const existing = open.find(i => i.body && i.body.includes(marker));
                if (existing) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: text });
                } else {
                  let data;
                  try {
                    ({ data } = await github.rest.issues.create({ owner, repo, title, body: text, labels: [LABEL] }));
                  } catch (error) {
                    core.warning(`Opening "${title}" with label ${LABEL} failed (${error.message}); opening it without the label.`);
                    ({ data } = await github.rest.issues.create({ owner, repo, title, body: text }));
                  }
                  open.push(data);
                }
              }
            }
            const programLines = (p) => (p.programs || []).map(q => `- ${q.name} (\`${q.catalog === 'guide' ? 'co-developer-funding-guide.json' : 'soft-funding-status.json'}\` → \`${q.id}\`, status \`${q.status}\`, last checked ${q.last_checked || 'never'})`);
            // One issue per page, up to MAX_PAGE_ISSUES a run; the rest go, in full, into one
            // combined issue, so a busy day cannot open dozens of issues or drop any detail.
            const MAX_PAGE_ISSUES = 15;
            const pageReport = (p) => {
              const who = (p.programs || []).map(q => q.name).join('; ') || p.agency || p.id;
              const parts = [`# Funding page changed: [${p.id}](${p.url})`, '', `Agency: ${p.agency || 'not recorded'}`, ''];
              if ((p.programs || []).length) parts.push('Programs this page stands for:', ...programLines(p), '', `Shown on: ${(p.shown_on || []).join('; ')}`, '');
              else parts.push('An agency announcement page: no catalog program rests on it. A new round here may be a program the catalogs do not list yet.', '');
              parts.push('Lines with dates, amounts or round words added:', fence(p.key_lines && p.key_lines.added), '',
                'Removed:', fence(p.key_lines && p.key_lines.removed), '');
              if ((p.new_documents || []).length) parts.push('New documents linked:', ...p.new_documents.map(d => `- [${d.title}](${d.url})`), '');
              if ((p.removed_documents || []).length) parts.push('Documents no longer linked:', ...p.removed_documents.map(d => `- [${d.title}](${d.url})`), '');
              if ((p.renamed_documents || []).length) parts.push('Documents renamed at the same address (the file may have been replaced):', ...p.renamed_documents.map(d => `- [${d.title}](${d.url}), was "${d.previous_title}"`), '');
              parts.push('## Next steps', '', '- Read the page. Most changes are wording or a new news item, not a new round.',
                '- If a round opened, closed or changed, update the program record with a quote from the page and today\'s date. This watch never changes a status itself.');
              return { who, text: parts.join('\n') };
            };
            for (const p of pages.slice(0, MAX_PAGE_ISSUES)) {
              const r = pageReport(p);
              await post(`<!-- funding-watch:${p.id} -->`, `Funding watch: ${r.who}`.slice(0, 200), r.text);
            }
            if (pages.length > MAX_PAGE_ISSUES) {
              const rest = pages.slice(MAX_PAGE_ISSUES);
              await post('<!-- funding-watch:overflow -->', 'Funding watch: more changed pages',
                [`# ${rest.length} more changed funding pages (${run.generated_at})`, '', ...rest.map(p => pageReport(p).text + '\n')].join('\n'));
            }
            // Every new notice is listed: once recorded it is never "new" again. post() splits
            // a long list into numbered parts.
            const noticeLine = n => `- [${n.title}](${n.url}): ${n.agency || ''}${n.close_date ? `, closes ${n.close_date}` : ''}${n.published ? `, published ${n.published}` : ''} (${n.source}, search "${n.query}")`;
            if (notices.length) {
              await post('<!-- funding-watch:federal -->', 'Funding watch: new federal funding notices',
                [`# ${notices.length} new federal funding notices (${run.generated_at})`, '',
                 'Check each for Colorado eligibility (state agencies, local governments, tribes, nonprofits or developers) and whether it can pay for housing or the infrastructure it needs.', '',
                 ...notices.map(noticeLine)].join('\n'));
            }
            if (unverifiable.length || run.all_fetches_failed) {
              await post('<!-- funding-watch:unverifiable -->', 'Funding watch: pages to check by hand',
                [run.all_fetches_failed ? '# No funding page or federal search could be reached this run. Page records and notices were kept as they were; only the failure dates were recorded.' : `# Funding pages failing for 3 days (${run.generated_at})`, '',
                 'A blocked or failing page is not "no change". Open each in a browser and check the program records it stands for.', '',
                 ...unverifiable.map(u => `- [${u.id}](${u.url}): ${u.error}, failing since ${u.failing_since}${u.programs.length ? `; programs: ${u.programs.join('; ')}` : ''}`)].join('\n'));
            }
            if (run.write_refused) {
              await post('<!-- funding-watch:write-refused -->', 'Funding watch result too large to record',
                `The watch file was not updated: ${run.write_refused}. Lower MAX_KEY_LINES or MAX_DOCS_PER_PAGE in scripts/audit/funding_watch.py.`);
            }

      - name: Commit refreshed funding watch
        id: funding-commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Untouched on a quiet day; check before rebuilding the manifests,
          # which always stamp a new time.
          if [ -z "$(git status --porcelain -- data/audit/funding-watch.json)" ]; then
            echo "Funding watch file unchanged; nothing to commit."
            exit 0
          fi
          node scripts/check-data-file-sizes.mjs
          # Commit the watch file alone and rebase it onto the current branch tip first,
          # then build the manifests on top: a manifest built on an older base (another
          # job pushed meanwhile) would conflict. Rebase, not merge -s ours (F119): a real
          # conflict must fail the job.
          git add data/audit/funding-watch.json
          git commit -m "chore: refresh funding-watch $(date -u +'%Y-%m-%d')"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          # AGENTS.md rule 3, in order: _manifest first (manifest.json records its size).
          npm run audit:file-manifest
          python3 scripts/rebuild_manifest.py
          node scripts/validate-schemas.js
          git add data/_manifest.json data/manifest.json
          git commit --amend --no-edit
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Trigger Pages deploy
        uses: ./.github/actions/dispatch-pages-deploy
