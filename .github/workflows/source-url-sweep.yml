name: Source URL Sweep

# Verify external source-citation URLs are still reachable. Closes audit
# item #1 from the 2026-04-20 outstanding-items review.
#
# Runs:
#   - weekly on Monday 8am MT (paired with Dependabot's cadence)
#   - manually via workflow_dispatch
#
# Exits non-zero on any 404 / server-error / fetch-error. Timeouts are
# treated as soft (many CI egress setups produce spurious timeouts).
#
# NOT on pull_request. It used to be, with paths `js/**/*.js` and
# `**/*.html`, so nearly every PR hard-blocked on a full sweep of ~180
# external citations — one federal site having a bad afternoon turned an
# unrelated PR red. #1544 failed on two govinfo.gov 502s for a bill its
# diff never mentions.
#
# ci-checks.yml already covers PRs, at both scopes and with the right
# blocking semantics: a changed-files sweep (`--diff-added`) that blocks,
# because a URL this PR introduces is this PR's responsibility, and a
# full-repository sweep marked `continue-on-error: true`, because rot in a
# citation the PR never touched is not. This workflow was a third
# invocation that contradicted the second one.
#
# Rot in existing citations is still caught here, on the weekly run, which
# opens a tracking issue. A few days slower, and it fails nobody's
# unrelated work.

on:
  schedule:
    # Mondays 14:00 UTC = 08:00 America/Denver in daylight time
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # so the scheduled run can open a tracking issue on failure

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run URL sweep
        # Hard-blocking: any new 404 / server-error / fetch-error on a cited
        # source URL fails CI. Timeouts are soft (the script exits 0 on
        # timeouts only). To skip a URL that legitimately blocks bots,
        # add it to ALLOW_LIST in scripts/audit/source-url-sweep.mjs with
        # a short justification comment.
        run: node scripts/audit/source-url-sweep.mjs --quiet
