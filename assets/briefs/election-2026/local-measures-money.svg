<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Housing money at stake in local measures (unofficial)</title>
<desc id="d">Bar chart of the first-year revenue cap in each local housing money measure. Broomfield 1A up to $3,300,000, too close to call; Mt. Crested Butte 2A up to $2,500,000, too close to call; San Juan County 1A up to $84,494, passed.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="24.0" font-size="16" font-weight="700" fill="#1d2329" text-anchor="start">Housing money at stake in the first full year</text>
<text x="16.0" y="44.0" font-size="12" font-weight="400" fill="#55606b" text-anchor="start">Revenue cap in each ballot question. Unofficial, as of 2026-11-04.</text>
<text x="16.0" y="80.0" font-size="12" font-weight="600" fill="#1d2329" text-anchor="start">Broomfield 1A</text>
<rect x="16" y="86.0" width="230.0" height="14" fill="#6b6b6b"/>
<text x="254.0" y="98.0" font-size="12" font-weight="700" fill="#1d2329" text-anchor="start">up to $3.3 million · Too close</text>
<text x="16.0" y="120.0" font-size="12" font-weight="600" fill="#1d2329" text-anchor="start">Mt. Crested Butte 2A</text>
<rect x="16" y="126.0" width="174.2" height="14" fill="#6b6b6b"/>
<text x="198.2" y="138.0" font-size="12" font-weight="700" fill="#1d2329" text-anchor="start">up to $2.5 million · Too close</text>
<text x="16.0" y="160.0" font-size="12" font-weight="600" fill="#1d2329" text-anchor="start">San Juan County 1A</text>
<rect x="16" y="166.0" width="5.9" height="14" fill="#1f5f99"/>
<text x="29.9" y="178.0" font-size="12" font-weight="700" fill="#1d2329" text-anchor="start">$84,494 · Passed</text>
<text x="16.0" y="204.0" font-size="11" font-weight="400" fill="#55606b" text-anchor="start">Caps are ceilings, not forecasts. San Juan: the full tax</text>
<text x="16.0" y="219.0" font-size="11" font-weight="400" fill="#55606b" text-anchor="start">increase; 45% of it goes to workforce housing and child care.</text>
<text x="16.0" y="234.0" font-size="11" font-weight="400" fill="#55606b" text-anchor="start">Lakewood 2G (failed) is not shown: it set no share aside for</text>
<text x="16.0" y="249.0" font-size="11" font-weight="400" fill="#55606b" text-anchor="start">housing or homelessness.</text>
<text x="16.0" y="270.0" font-size="11" font-weight="400" fill="#55606b" text-anchor="start">Source: ballot text in the site’s ballot records; county results</text>
<text x="16.0" y="285.0" font-size="11" font-weight="400" fill="#55606b" text-anchor="start">pages, read 2026-11-04.</text>
</svg>
