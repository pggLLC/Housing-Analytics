<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 325" width="420" height="325" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Money at stake in local housing measures (unofficial)</title>
<desc id="d">Bar chart of the first-year revenue cap in each local money measure. Lakewood 2G $17,600,000, failed; Broomfield 1A $3,300,000, too close to call; Mt. Crested Butte 2A $2,500,000, too close to call; San Juan County 1A $84,494, passed.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="24.0" font-size="16" font-weight="700" fill="#1d2329" text-anchor="start">Money at stake in the first full year</text>
<text x="16.0" y="44.0" font-size="12" font-weight="400" fill="#55606b" text-anchor="start">Revenue cap in each ballot question. Unofficial, as of 2026-11-04.</text>
<text x="16.0" y="80.0" font-size="12" font-weight="600" fill="#1d2329" text-anchor="start">Lakewood 2G (all uses)</text>
<rect x="16" y="86.0" width="230.0" height="14" fill="#b3541e"/>
<text x="254.0" y="98.0" font-size="12" font-weight="700" fill="#1d2329" text-anchor="start">$17.6 million · Failed</text>
<text x="16.0" y="120.0" font-size="12" font-weight="600" fill="#1d2329" text-anchor="start">Broomfield 1A</text>
<rect x="16" y="126.0" width="43.1" height="14" fill="#6b6b6b"/>
<text x="67.1" y="138.0" font-size="12" font-weight="700" fill="#1d2329" text-anchor="start">$3.3 million · Too close</text>
<text x="16.0" y="160.0" font-size="12" font-weight="600" fill="#1d2329" text-anchor="start">Mt. Crested Butte 2A</text>
<rect x="16" y="166.0" width="32.7" height="14" fill="#6b6b6b"/>
<text x="56.7" y="178.0" font-size="12" font-weight="700" fill="#1d2329" text-anchor="start">$2.5 million · Too close</text>
<text x="16.0" y="200.0" font-size="12" font-weight="600" fill="#1d2329" text-anchor="start">San Juan County 1A</text>
<rect x="16" y="206.0" width="2.0" height="14" fill="#1f5f99"/>
<text x="26.0" y="218.0" font-size="12" font-weight="700" fill="#1d2329" text-anchor="start">$84,494 · Passed</text>
<text x="16.0" y="244.0" font-size="11" font-weight="400" fill="#55606b" text-anchor="start">San Juan: the full tax increase; 45% of it goes to workforce</text>
<text x="16.0" y="259.0" font-size="11" font-weight="400" fill="#55606b" text-anchor="start">housing and child care. Lakewood: most of the money was for</text>
<text x="16.0" y="274.0" font-size="11" font-weight="400" fill="#55606b" text-anchor="start">police and traffic.</text>
<text x="16.0" y="295.0" font-size="11" font-weight="400" fill="#55606b" text-anchor="start">Source: ballot text in the site’s ballot records; county results</text>
<text x="16.0" y="310.0" font-size="11" font-weight="400" fill="#55606b" text-anchor="start">pages, read 2026-11-04.</text>
</svg>
