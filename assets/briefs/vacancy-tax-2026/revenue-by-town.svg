<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 686" width="420" height="686" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">What a $4,000 vacancy tax could raise a year</title>
<desc id="d">Dot-and-range chart of the yearly revenue a $4,000 vacancy tax could raise, paid by owners of vacant homes, in the 15 home-rule places with the largest middle case. Denver: middle $12.0M, range $5.9M to $20.1M; Breckenridge: middle $8.1M, range $4.3M to $13.0M; Vail: middle $6.3M, range $3.4M to $10.1M; Steamboat Springs: middle $6.1M, range $3.3M to $9.9M; Colorado Springs: middle $4.7M, range $2.3M to $7.8M; Keystone: middle $3.9M, range $2.1M to $6.2M; Winter Park: middle $3.7M, range $2.0M to $5.9M; Frisco: middle $3.5M, range $1.8M to $5.5M; Aurora: middle $2.9M, range $1.4M to $4.9M; Avon: middle $2.8M, range $1.5M to $4.6M; Pueblo: middle $2.7M, range $1.3M to $4.7M; Aspen: middle $2.7M, range $1.4M to $4.3M; Snowmass Village: middle $1.9M, range $988K to $3.0M; Lakewood: middle $1.7M, range $815K to $2.9M; Mount Crested Butte: middle $1.7M, range $887K to $2.7M.</desc>
