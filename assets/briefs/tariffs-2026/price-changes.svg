<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 692" width="420" height="692" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Building material prices, change in one year</title>
<desc id="d">Bar chart of the change in US producer prices for 17 building materials from October 2025 to October 2026. Steel mill products: +32.9%; Copper and brass shapes (pipe, tube, sheet): +23.9%; Aluminum shapes (sheet, bar, extrusions): +23.3%; Electrical wire and cable: +19.6%; Plywood: +16.9%; Switchgear and electrical panels: +12.7%; Softwood lumber: +10.6%; Sheet metal products: +7.8%; Metal doors, frames and trim: +7.3%; Transformers: +5.6%; Plumbing fittings and trim: +5.1%; Heating, cooling and refrigeration equipment: +4.1%; Ready-mix concrete: +2.4%; Brick and clay tile: +1.3%; Gypsum products (drywall): +0.9%; Major appliances (factory price): -0.2%; Cement: -0.4%.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
