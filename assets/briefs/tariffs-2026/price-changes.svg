<text x="16.0" y="44.0" font-size="12" font-weight="400" fill="#55606b" text-anchor="start">US producer prices, October 2025 to October 2026.</text>
<text x="16.0" y="62.0" font-size="12" font-weight="400" fill="#55606b" text-anchor="start">Dark bars: metal and electrical. Light bars: everything else.</text>
