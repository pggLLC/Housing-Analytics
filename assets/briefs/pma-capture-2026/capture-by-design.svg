<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 744" width="420" height="744" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">One project, 19 market areas: the CHFA capture rate</title>
<desc id="d">Bar chart of the CHFA capture rate for the same 60-home family project in the same small town under 19 ways of drawing the market area, counting renter households only, with CHFA's 85% limit marked. The town's own two tracts (whole tracts): 55.6%; The town's tracts plus one neighbouring rural tract (whole tracts): 27.1%; Best fit plus a large remote tract of mostly second homes (whole tracts): 23.9%; Best fit plus the tract toward the city (whole tracts): 27.1%; Best fit plus the regional city (whole tracts): 42.9%; The whole county (whole tracts): 36.7%; Within 10 minutes by road (drive time, part tracts): 122.4%; Within 15 minutes by road (drive time, part tracts): 81.1%; Within 20 minutes by road (drive time, part tracts): 65.1%; Within 30 minutes by road (drive time, part tracts): 80.4%; Tracts with most people within 20 minutes (drive time, whole tracts): 55.6%; Tracts with most people within 30 minutes (drive time, whole tracts): 35.4%; Within 5 miles in a straight line (radius, part tracts): 75.9%; Within 10 miles in a straight line (radius, part tracts): 27.9%; Within 15 miles in a straight line (radius, part tracts): 43.6%; Tracts whose centre is within 10 miles (radius, whole tracts): 27.1%; Block groups with most people within 20 minutes (block groups): 50.0%; Tracts sending 5% or more of the site tract's workers (commuter shed): 27.1%; Tracts housing 75% of the site tract's workers (commuter shed): 31.8%.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="24.0" font-size="16" font-weight="700" fill="#1d2329" text-anchor="start">One project, 19 market areas: CHFA capture rate</text>
<text x="16.0" y="44.0" font-size="12" font-weight="400" fill="#55606b" text-anchor="start">Same 60 family homes, same small town. Renter households only.</text>
<text x="16.0" y="62.0" font-size="12" font-weight="400" fill="#55606b" text-anchor="start">Dashed line: CHFA's 85% limit. Dark bars: whole census tracts,</text>
<text x="16.0" y="78.0" font-size="12" font-weight="400" fill="#55606b" text-anchor="start">the only shape CHFA accepts. Light bars: not allowed as drawn.</text>
